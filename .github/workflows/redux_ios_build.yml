name: Super Redux-Redux iOS FINAL MAX FPS v10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Final MAX FPS
    runs-on: macos-14
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # CHECK OLD WORKFLOW
      #
      # We reuse the patch steps that already went GREEN
      # in the existing v9 workflow.
      # ==========================================================

      - name: Check existing Super RR workflow
        shell: bash
        run: |
          set -e

          BASE="$GITHUB_WORKSPACE/.github/workflows/redux_ios_build.yml"

          if [ ! -f "$BASE" ]; then
            echo "ERROR: redux_ios_build.yml not found"
            echo
            echo "Keep the old redux_ios_build.yml"
            echo "and create this v10 as a NEW workflow file."
            exit 1
          fi

          echo "Found:"
          echo "$BASE"

          grep -n \
            "Patch Redux gameplay controls" \
            "$BASE"

          grep -n \
            "Add R LOOK LOCK" \
            "$BASE"

          grep -n \
            "Add PAUSE FPS and right LOOK" \
            "$BASE"

          grep -n \
            "Force Modern GL and performance mode" \
            "$BASE"

          echo
          echo "Base workflow ready."

      # ==========================================================
      # RUN THE ALREADY-TESTED GREEN STEPS FROM v9
      #
      # This avoids copying thousands of lines again.
      # We intentionally STOP before the profiler.
      # ==========================================================

      - name: Apply known-good Super RR patches
        shell: bash
        run: |
          set -euo pipefail

          BASE="$GITHUB_WORKSPACE/.github/workflows/redux_ios_build.yml"

          run_old_step() {

            STEP_NAME="$1"

            echo
            echo "========================================"
            echo "RUNNING: $STEP_NAME"
            echo "========================================"

            TMP_SCRIPT="$RUNNER_TEMP/superrr-step.sh"

            python3 \
              "$BASE" \
              "$STEP_NAME" \
              "$TMP_SCRIPT" <<'PY'
          from pathlib import Path
          import sys

          workflow_path = Path(sys.argv[1])
          wanted_name = sys.argv[2]
          output_path = Path(sys.argv[3])

          lines = workflow_path.read_text().splitlines()

          step_line = (
              "      - name: " +
              wanted_name
          )

          start_index = None

          for i, line in enumerate(lines):
              if line.rstrip() == step_line:
                  start_index = i
                  break

          if start_index is None:
              raise SystemExit(
                  "ERROR: step not found: " +
                  wanted_name
              )

          run_index = None

          for i in range(
              start_index + 1,
              len(lines)
          ):
              line = lines[i]

              if line.startswith(
                  "      - name: "
              ):
                  break

              if line.rstrip() == (
                  "        run: |"
              ):
                  run_index = i
                  break

          if run_index is None:
              raise SystemExit(
                  "ERROR: run block missing: " +
                  wanted_name
              )

          code = []

          for i in range(
              run_index + 1,
              len(lines)
          ):
              line = lines[i]

              if line.startswith(
                  "      - name: "
              ):
                  break

              if line.strip() == "":
                  code.append("")
                  continue

              if line.startswith(
                  "          "
              ):
                  code.append(
                      line[10:]
                  )
                  continue

              indent = (
                  len(line) -
                  len(line.lstrip(" "))
              )

              if indent < 10:
                  break

              code.append(
                  line[10:]
              )

          if not code:
              raise SystemExit(
                  "ERROR: empty run block: " +
                  wanted_name
              )

          output_path.write_text(
              "\n".join(code) +
              "\n"
          )

          print(
              "Extracted:",
              wanted_name
          )
          PY

            chmod +x "$TMP_SCRIPT"

            bash "$TMP_SCRIPT"

            # GitHub normally loads GITHUB_ENV
            # between Actions steps.
            #
            # Here several old steps run inside
            # one Actions step, so reload simple
            # KEY=value entries ourselves.
            if [ -f "$GITHUB_ENV" ]; then

              while IFS= read -r ENV_LINE; do

                case "$ENV_LINE" in
                  *=*)
                    export "$ENV_LINE"
                    ;;
                esac

              done < "$GITHUB_ENV"

            fi

            echo
            echo "DONE: $STEP_NAME"
          }

          # ------------------------------------------------------
          # SAME STEPS THAT ALREADY PASSED ON YOUR SCREEN
          # ------------------------------------------------------

          run_old_step \
            "Download Super Redux-Redux"

          run_old_step \
            "Download Butterscotch iOS"

          run_old_step \
            "Apply GL and VM performance patches"

          run_old_step \
            "Prepare iPhone compiler"

          run_old_step \
            "Set app info"

          run_old_step \
            "Bundle complete Super Redux-Redux"

          run_old_step \
            "Patch Redux rendering"

          run_old_step \
            "Patch Redux gameplay controls"

          run_old_step \
            "Add R LOOK LOCK"

          run_old_step \
            "Add PAUSE FPS and right LOOK"

          run_old_step \
            "Force Modern GL and performance mode"

          echo
          echo "========================================"
          echo "ALL KNOWN-GOOD PATCHES APPLIED"
          echo "========================================"

      # ==========================================================
      # FINAL MAX-FPS PATCH
      # ==========================================================

      - name: Apply FINAL MAX FPS tuning
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          python3 <<'PY'
          from pathlib import Path
          import re

          main = Path(
              "Butterscotch/src/ios/main.c"
          )

          loop = Path(
              "Butterscotch/src/loop.c"
          )

          math = Path(
              "Butterscotch/src/math_compat.h"
          )

          if not main.exists():
              raise SystemExit(
                  "ERROR: main.c missing"
              )

          if not loop.exists():
              raise SystemExit(
                  "ERROR: loop.c missing"
              )

          if not math.exists():
              raise SystemExit(
                  "ERROR: math_compat.h missing"
              )

          # ======================================================
          # MAIN.C
          # ======================================================

          s = main.read_text()

          # ------------------------------------------------------
          # 1. DO NOT POLL PHYSICAL CONTROLLERS EVERY FRAME
          #
          # This build uses the touch controls.
          # ------------------------------------------------------

          pattern = re.compile(
              r'(bool\s+platformHandleEvents'
              r'\s*\(\s*void\s*\)\s*\{\s*)'
              r'bsPollGameControllers'
              r'\s*\(\s*\)\s*;\s*',
              re.MULTILINE
          )

          s2, count = pattern.subn(
              r'\1',
              s,
              count=1
          )

          if count == 1:
              s = s2
              print(
                  "GameController polling OFF."
              )
          else:
              print(
                  "GameController poll already removed."
              )

          # ------------------------------------------------------
          # 2. MAX FPS INTERNAL RESOLUTION
          #
          # Previous patch = 72%.
          #
          # FINAL = 60%.
          #
          # 0.60 x 0.60 = 36% of native pixel work.
          # ------------------------------------------------------

          if (
              "targetScale *= 0.72f;"
              in s
          ):

              s = s.replace(
                  "targetScale *= 0.72f;",
                  "targetScale *= 0.60f;",
                  1
              )

              print(
                  "Framebuffer 72% -> 60%."
              )

          elif (
              "targetScale *= 0.60f;"
              in s
          ):

              print(
                  "Framebuffer already 60%."
              )

          else:

              raise SystemExit(
                  "ERROR: render scale patch missing"
              )

          # ------------------------------------------------------
          # 3. FORCE HIGH RES OFF
          # ------------------------------------------------------

          highres_pattern = re.compile(
              r'static\s+bool\s+'
              r'bsLoadHighResEnabled'
              r'\s*\(\s*void\s*\)'
              r'\s*\{.*?\n\}',
              re.DOTALL
          )

          highres_new = '''static bool bsLoadHighResEnabled(void) {
              return false;
          }'''

          s2, count = highres_pattern.subn(
              highres_new,
              s,
              count=1
          )

          if count == 1:
              s = s2
              print(
                  "High resolution forced OFF."
              )

          # ------------------------------------------------------
          # 4. AUTOMATIC GAME INSTALLER
          #
          # Only insert if old installer isn't present.
          # ------------------------------------------------------

          if (
              @"Super R-R installed."
              if False
              else False
          ):
              pass

          if (
              '@"Super R-R installed."'
              not in s
          ):

              needle = (
                  "    gameListVC = "
                  "[[BSGameListViewController "
                  "alloc] init];"
              )

              if needle not in s:
                  raise SystemExit(
                      "ERROR: gameListVC marker missing"
                  )

              installer = r'''
              @autoreleasepool {

                  NSFileManager *fm =
                      [NSFileManager defaultManager];

                  NSArray *roots =
                      bsGamesRootsToScan();

                  if ([roots count] > 0) {

                      NSString *root =
                          [roots objectAtIndex:0];

                      NSString *gamesDir =
                          [root
                              stringByAppendingPathComponent:
                                  @"games"];

                      NSString *gameDest =
                          [gamesDir
                              stringByAppendingPathComponent:
                                  @"Super R-R"];

                      NSString *dataDest =
                          [gameDest
                              stringByAppendingPathComponent:
                                  @"data.win"];

                      if (![fm
                          fileExistsAtPath:
                              dataDest]) {

                          NSString *source =
                              [[[NSBundle mainBundle]
                                  resourcePath]
                                  stringByAppendingPathComponent:
                                      @"BundledGame"];

                          [fm
                              createDirectoryAtPath:
                                  gamesDir
                              withIntermediateDirectories:
                                  YES
                              attributes:
                                  nil
                              error:
                                  nil];

                          NSError *copyError =
                              nil;

                          if (![fm
                              copyItemAtPath:
                                  source
                              toPath:
                                  gameDest
                              error:
                                  &copyError]) {

                              NSLog(
                                  @"Super R-R copy failed: %@",
                                  copyError
                              );

                          } else {

                              NSLog(
                                  @"Super R-R installed."
                              );
                          }
                      }
                  }
              }

              gameListVC =
                  [[BSGameListViewController alloc]
                      init];'''

              s = s.replace(
                  needle,
                  installer,
                  1
              )

              print(
                  "Automatic installer added."
              )

          else:

              print(
                  "Automatic installer already present."
              )

          main.write_text(s)

          # ======================================================
          # LOOP.C
          # ======================================================

          l = loop.read_text()

          # We do not use physical gamepads,
          # so avoid their per-frame bookkeeping.
          gamepad_line = (
              "            "
              "RunnerGamepad_beginFrame"
              "(runner->gamepads);\n"
          )

          if gamepad_line in l:

              l = l.replace(
                  gamepad_line,
                  "",
                  1
              )

              print(
                  "Gamepad frame bookkeeping OFF."
              )

          loop.write_text(l)

          # ======================================================
          # MATH COMPATIBILITY
          # ======================================================

          m = math.read_text()

          if (
              "#undef NO_FABSF"
              not in m
          ):

              marker = (
                  '#include "real_type.h"'
              )

              if marker not in m:
                  raise SystemExit(
                      "ERROR: real_type include missing"
                  )

              fix = '''#include "real_type.h"

          /*
           * iOS already supplies these.
           */
          #if defined(__APPLE__)
          #undef NO_LROUND
          #undef NO_SQRTF
          #undef NO_FABSF
          #undef NO_FMODF
          #undef NO_SINF
          #undef NO_COSF
          #undef NO_FLOORF
          #undef NO_ROUNDF
          #endif'''

              m = m.replace(
                  marker,
                  fix,
                  1
              )

              math.write_text(m)

              print(
                  "iOS math fix installed."
              )

          else:

              print(
                  "iOS math fix already present."
              )

          print("")
          print(
              "======================================"
          )
          print(
              "FINAL MAX FPS SOURCE READY"
          )
          print(
              "======================================"
          )
          PY

      # ==========================================================
      # VERIFY FINAL SOURCE
      # ==========================================================

      - name: Verify FINAL patches
        shell: bash
        run: |
          set -e

          MAIN="$GITHUB_WORKSPACE/Butterscotch/src/ios/main.c"

          echo
          echo "======================================"
          echo "FINAL SOURCE CHECK"
          echo "======================================"

          echo
          echo "Modern GL:"
          grep -n \
            "return BS_RENDERER_MODERN_GL" \
            "$MAIN"

          echo
          echo "60% render scale:"
          grep -n \
            "targetScale \*= 0.60f" \
            "$MAIN"

          echo
          echo "R:"
          grep -n \
            "key:'R'" \
            "$MAIN"

          echo
          echo "LOOK:"
          grep -n \
            'label:@"LOOK"' \
            "$MAIN"

          echo
          echo "LOCK:"
          grep -n \
            'label:@"LOCK"' \
            "$MAIN"

          echo
          echo "PAUSE:"
          grep -n \
            'label:@"II"' \
            "$MAIN"

          echo
          echo "FPS:"
          grep -n \
            "bsDisplayedFPS" \
            "$MAIN" \
            | head

          echo
          echo "RIGHT LOOK:"
          grep -n \
            "BSLookPad" \
            "$MAIN" \
            | head

          echo
          echo "Installer:"
          grep -n \
            "Super R-R installed" \
            "$MAIN"

          echo
          echo "======================================"
          echo "ALL FINAL PATCHES PRESENT"
          echo "======================================"

      # ==========================================================
      # PREPARE CPU FLAGS
      # ==========================================================

      - name: Detect Apple A14 compiler tuning
        shell: bash
        run: |
          set -e

          cat > "$RUNNER_TEMP/a14-test.c" <<'EOF'
          int main(void) {
              return 0;
          }
          EOF

          CPU_FLAGS=""

          if "$IOS_CC" \
              -c \
              "$RUNNER_TEMP/a14-test.c" \
              -o "$RUNNER_TEMP/a14-test.o" \
              -mcpu=apple-a14 \
              -mtune=apple-a14 \
              >/dev/null 2>&1; then

            CPU_FLAGS="-mcpu=apple-a14 -mtune=apple-a14"

            echo "Apple A14 tuning supported."

          else

            echo "Apple A14 tuning not supported."
            echo "Using generic ARM64 safely."
          fi

          echo "CPU_FLAGS=$CPU_FLAGS" \
            >> "$GITHUB_ENV"

      # ==========================================================
      # CLEAN
      # ==========================================================

      - name: Clean previous build
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/Butterscotch"

          make distclean || true

      # ==========================================================
      # FINAL PERFORMANCE BUILD
      #
      # IMPORTANT:
      #
      # GML profiler = COMPILED OUT
      # Opcode profiler = COMPILED OUT
      # Tracing = COMPILED OUT
      # Stub logging = COMPILED OUT
      #
      # No diagnostic overhead at all.
      # ==========================================================

      - name: Build FINAL MAX FPS
        shell: bash
        run: |
          set +e

          cd "$GITHUB_WORKSPACE/Butterscotch"

          HASH="$(
            git rev-parse \
              --short HEAD
          )"

          DATE="$(
            git show \
              -s \
              --format=%cs \
              HEAD
          )"

          echo
          echo "======================================"
          echo "SUPER REDUX-REDUX FINAL MAX FPS v10"
          echo "======================================"
          echo
          echo "ARM64"
          echo "CPU flags: $CPU_FLAGS"
          echo "Modern GL forced"
          echo "Software renderer avoided"
          echo "60% framebuffer"
          echo "High resolution OFF"
          echo "GameController polling OFF"
          echo "GML profiler COMPLETELY OFF"
          echo "Opcode profiler COMPLETELY OFF"
          echo "VM tracing COMPLETELY OFF"
          echo "Stub logs COMPLETELY OFF"
          echo "O3"
          echo "Thin LTO"
          echo "frame pointer OFF"
          echo "math errno OFF"
          echo "FP contraction FAST"
          echo

          make \
            -j4 \
            OS=iOS \
            CC="$IOS_CC" \
            CFLAGS="-O3 -DNDEBUG -flto=thin -fomit-frame-pointer -fno-math-errno -ffp-contract=fast $CPU_FLAGS" \
            LDFLAGS="-flto=thin -Wl,-dead_strip" \
            DISABLE_WAD14=1 \
            DISABLE_WAD17=1 \
            DISABLE_VM_GML_PROFILER=1 \
            DISABLE_VM_OPCODE_PROFILER=1 \
            DISABLE_VM_STUB_LOGS=1 \
            DISABLE_VM_TRACING=1 \
            BUTTERSCOTCH_COMMIT_HASH="$HASH" \
            BUTTERSCOTCH_COMMIT_DATE="$DATE" \
            2>&1 \
            | tee \
              "$GITHUB_WORKSPACE/final-max-fps.log"

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then

            echo
            echo "======================================"
            echo "REAL BUILD ERRORS"
            echo "======================================"

            grep \
              -n \
              -E \
              "error:|fatal error:|ERROR:" \
              "$GITHUB_WORKSPACE/final-max-fps.log" \
              | tail \
                  -200 \
              || true

            echo
            echo "======================================"

            exit "$STATUS"
          fi

          echo
          echo "======================================"
          echo "FINAL BUILD FINISHED"
          echo "======================================"

          find build \
            -maxdepth 2 \
            -type f \
            -print

      # ==========================================================
      # VERIFY IPA
      # ==========================================================

      - name: Verify FINAL IPA
        shell: bash
        run: |
          set -e

          IPA="$GITHUB_WORKSPACE/Butterscotch/build/butterscotch.ipa"

          BIN="$GITHUB_WORKSPACE/Butterscotch/build/butterscotch"

          test -f "$IPA"
          test -f "$BIN"

          echo
          echo "Binary:"
          file "$BIN"

          echo
          echo "Architecture:"
          lipo \
            -info \
            "$BIN" \
            || true

          echo
          echo "IPA:"
          ls \
            -lh \
            "$IPA"

          echo
          echo "Bundled game:"
          unzip \
            -l \
            "$IPA" \
            | grep \
                -i \
                "BundledGame/data.win"

      # ==========================================================
      # OUTPUT
      # ==========================================================

      - name: Prepare FINAL IPA
        shell: bash
        run: |
          set -e

          mkdir -p \
            "$GITHUB_WORKSPACE/output"

          cp \
            "$GITHUB_WORKSPACE/Butterscotch/build/butterscotch.ipa" \
            "$GITHUB_WORKSPACE/output/Super-Redux-Redux-iOS-FINAL-MAX-FPS-v10.ipa"

          cat > \
            "$GITHUB_WORKSPACE/output/README.txt" \
            <<'EOF'
          SUPER REDUX-REDUX iOS
          FINAL MAX FPS v10
          ===================

          THIS IS THE FINAL PERFORMANCE BUILD.


          PERFORMANCE
          -----------

          Modern GL forced

          Software renderer avoided

          ARM64

          Apple A14 tuning when supported

          O3

          Thin LTO

          60% framebuffer

          High-resolution mode OFF

          GameController polling OFF

          GML profiler COMPLETELY REMOVED

          Opcode profiler COMPLETELY REMOVED

          VM tracing COMPLETELY REMOVED

          Stub logging COMPLETELY REMOVED


          CONTROLS
          --------

          LEFT STICK
          movement

          RIGHT LOOK
          look / aim

          TOUCH GAME AREA
          direct aim

          A
          shoot / punch / Enter

          X
          pickup / throw

          C
          interaction

          R
          restart

          LOOK
          Shift

          LOCK
          middle mouse

          II
          pause

          FPS
          frame counter


          TEST
          ----

          1. Mask selection

          2. Normal level

          3. Fight with several enemies


          TARGET
          ------

          MASKS:
          30-60 FPS

          LEVEL:
          45-60 FPS


          IPA is unsigned/ad-hoc.
          EOF

          echo
          echo "======================================"
          echo "OUTPUT"
          echo "======================================"

          ls \
            -lh \
            "$GITHUB_WORKSPACE/output"

      # ==========================================================
      # UPLOAD
      # ==========================================================

      - name: Upload FINAL MAX FPS IPA
        uses: actions/upload-artifact@v4
        with:
          name: super-redux-redux-ios-FINAL-MAX-FPS-v10
          path: |
            output/Super-Redux-Redux-iOS-FINAL-MAX-FPS-v10.ipa
            output/README.txt
          if-no-files-found: error
          retention-days: 7

      # ==========================================================
      # DEBUG
      # ==========================================================

      - name: Upload debug files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: super-rr-final-max-fps-failed
          path: |
            Butterscotch/src/ios/main.c
            Butterscotch/src/vm_builtins.c
            Butterscotch/src/loop.c
            Butterscotch/src/math_compat.h
            Butterscotch/compat/config.mk
            final-max-fps.log
          if-no-files-found: ignore
          retention-days: 7
