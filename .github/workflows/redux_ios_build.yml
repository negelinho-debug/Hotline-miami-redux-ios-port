          dpad_impl_marker = '''@implementation BSDpad'''

          look_impl = r'''
          @implementation BSLookPad

          @synthesize frame = _frame;


          - (id)initWithFrame:(CGRect)frame {

              if ((self = [super init])) {

                  _frame =
                      frame;

                  _touch =
                      nil;

                  _thumbOffset =
                      CGPointZero;
              }

              return self;
          }


          - (void)updateAimFromPoint:
              (CGPoint)point {

              CGPoint offset =
                  joystickClampOffset(
                      _frame,
                      point
                  );

              _thumbOffset =
                  offset;

              CGFloat maxR =
                  joystickRadius(
                      _frame
                  );

              if (maxR <= 1.0f)
                  return;

              CGFloat nx =
                  offset.x / maxR;

              CGFloat ny =
                  offset.y / maxR;

              CGFloat deadzone =
                  0.12f;

              if (fabs(nx) < deadzone)
                  nx = 0.0f;

              if (fabs(ny) < deadzone)
                  ny = 0.0f;

              CGRect screen =
                  [[UIScreen mainScreen]
                      bounds];

              double cx =
                  screen.size.width * 0.5;

              double cy =
                  screen.size.height * 0.5;

              double radiusX =
                  screen.size.width * 0.42;

              double radiusY =
                  screen.size.height * 0.42;

              double mx =
                  cx +
                  ((double)nx * radiusX);

              double my =
                  cy +
                  ((double)ny * radiusY);

              if (mx < 0.0)
                  mx = 0.0;

              if (my < 0.0)
                  my = 0.0;

              if (mx > screen.size.width)
                  mx = screen.size.width;

              if (my > screen.size.height)
                  my = screen.size.height;

              atomic_store(
                  &bsTouchMouseX,
                  mx
              );

              atomic_store(
                  &bsTouchMouseY,
                  my
              );
          }


          - (BOOL)handleTouchBegan:
              (UITouch *)touch
              point:(CGPoint)point {

              if (_touch)
                  return NO;

              if (!CGRectContainsPoint(
                      CGRectInset(
                          _frame,
                          -12.0f,
                          -12.0f
                      ),
                      point
                  ))
                  return NO;

              _touch =
                  [touch retain];

              [self updateAimFromPoint:
                  point];

              return YES;
          }


          - (BOOL)handleTouchMoved:
              (UITouch *)touch
              point:(CGPoint)point {

              if (touch != _touch)
                  return NO;

              [self updateAimFromPoint:
                  point];

              return YES;
          }


          - (BOOL)handleTouchEnded:
              (UITouch *)touch {

              if (touch != _touch)
                  return NO;

              _thumbOffset =
                  CGPointZero;

              [_touch release];

              _touch =
                  nil;

              return YES;
          }


          - (void)drawInContext:
              (CGContextRef)ctx {

              CGFloat cx =
                  _frame.origin.x +
                  _frame.size.width *
                  0.5f;

              CGFloat cy =
                  _frame.origin.y +
                  _frame.size.height *
                  0.5f;

              CGFloat baseR =
                  joystickRadius(
                      _frame
                  );

              CGRect baseRect =
                  CGRectMake(
                      cx - baseR,
                      cy - baseR,
                      baseR * 2.0f,
                      baseR * 2.0f
                  );

              CGContextSetRGBFillColor(
                  ctx,
                  1.0f,
                  1.0f,
                  1.0f,
                  _touch
                      ? 0.42f
                      : 0.20f
              );

              CGContextFillEllipseInRect(
                  ctx,
                  baseRect
              );

              CGFloat thumbR =
                  baseR * 0.34f;

              CGFloat thumbX =
                  cx +
                  _thumbOffset.x;

              CGFloat thumbY =
                  cy +
                  _thumbOffset.y;

              CGRect thumbRect =
                  CGRectMake(
                      thumbX - thumbR,
                      thumbY - thumbR,
                      thumbR * 2.0f,
                      thumbR * 2.0f
                  );

              CGContextSetRGBFillColor(
                  ctx,
                  1.0f,
                  1.0f,
                  1.0f,
                  0.50f
              );

              CGContextFillEllipseInRect(
                  ctx,
                  thumbRect
              );

              UIFont *font =
                  [UIFont
                      boldSystemFontOfSize:
                          8.0f];

              NSString *label =
                  @"LOOK";

              CGSize labelSize =
                  [label
                      sizeWithAttributes:
                          @{
                              NSFontAttributeName:
                                  font
                          }];

              [label drawAtPoint:
                  CGPointMake(
                      cx -
                          labelSize.width /
                          2.0f,
                      cy -
                          labelSize.height /
                          2.0f
                  )
                  withAttributes:
                      @{
                          NSFontAttributeName:
                              font,
                          NSForegroundColorAttributeName:
                              [UIColor whiteColor]
                      }];
          }


          - (void)dealloc {

              if (_touch)
                  [_touch release];

              [super dealloc];
          }

          @end


          '''

          if dpad_impl_marker not in s:
              raise SystemExit(
                  "ERROR: BSDpad implementation missing"
              )

          s = s.replace(
              dpad_impl_marker,
              look_impl +
              dpad_impl_marker,
              1
          )

          p.write_text(s)

          print("v5 controls preserved.")
          print("Pause = YES")
          print("FPS counter = YES")
          print("Right LOOK stick = YES")
          PY

      # ==========================================================
      # NEW v6 RUNTIME CPU SCHEDULING
      #
      # Do not modify gameplay.
      # Give game thread UserInteractive QoS.
      # ==========================================================

      - name: Add v6 runtime FPS tuning
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          python3 <<'PY'
          from pathlib import Path

          p = Path("Butterscotch/src/ios/main.c")
          s = p.read_text()

          old = '''- (void)gameThread {
              NSAutoreleasePool *pool = [[NSAutoreleasePool alloc] init];'''

          new = '''- (void)gameThread {
              NSAutoreleasePool *pool = [[NSAutoreleasePool alloc] init];

              /*
               * Super R-R v6 performance:
               * game/VM thread gets highest interactive QoS.
               * No gameplay logic is changed.
               */
              if ([[NSThread currentThread]
                      respondsToSelector:
                          @selector(setQualityOfService:)]) {

                  [[NSThread currentThread]
                      setQualityOfService:
                          NSQualityOfServiceUserInteractive];
              }'''

          if old not in s:
              raise SystemExit(
                  "ERROR: gameThread marker missing"
              )

          s = s.replace(
              old,
              new,
              1
          )

          p.write_text(s)

          print("Game thread QoS = UserInteractive")
          print("Gameplay unchanged.")
          PY

      # ==========================================================
      # AUTOMATIC GAME INSTALL
      # ==========================================================

      - name: Add automatic game installer
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "Butterscotch/src/ios/main.c"
          )

          s = p.read_text()

          needle = '''
              gameListVC = [[BSGameListViewController alloc] init];
          '''

          patch = r'''
              @autoreleasepool {

                  NSFileManager *fm =
                      [NSFileManager defaultManager];

                  NSArray *roots =
                      bsGamesRootsToScan();

                  if ([roots count] > 0) {

                      NSString *root =
                          [roots objectAtIndex:0];

                      NSString *gamesDir =
                          [root stringByAppendingPathComponent:
                              @"games"];

                      NSString *gameDest =
                          [gamesDir stringByAppendingPathComponent:
                              @"Super R-R"];

                      NSString *dataDest =
                          [gameDest stringByAppendingPathComponent:
                              @"data.win"];

                      if (![fm
                          fileExistsAtPath:dataDest]) {

                          NSString *source =
                              [[[NSBundle mainBundle]
                                  resourcePath]
                                  stringByAppendingPathComponent:
                                      @"BundledGame"];

                          [fm
                              createDirectoryAtPath:gamesDir
                              withIntermediateDirectories:YES
                              attributes:nil
                              error:nil];

                          NSError *copyError = nil;

                          if (![fm
                              copyItemAtPath:source
                              toPath:gameDest
                              error:&copyError]) {

                              NSLog(
                                  @"Super R-R copy failed: %@",
                                  copyError
                              );

                          } else {

                              NSLog(
                                  @"Super R-R installed."
                              );
                          }
                      }
                  }
              }

              gameListVC =
                  [[BSGameListViewController alloc]
                      init];
          '''

          if needle not in s:
              raise SystemExit(
                  "ERROR: game list marker missing"
              )

          s = s.replace(
              needle,
              patch,
              1
          )

          p.write_text(s)

          print("Bundled game installer complete.")
          PY

      # ==========================================================
      # CLEAN
      # ==========================================================

      - name: Clean previous build
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/Butterscotch"

          make distclean || true

      # ==========================================================
      # v6 PERFORMANCE BUILD
      #
      # O3
      # Thin LTO
      # frame pointer removed
      # VM profilers/logs/tracing disabled
      # normal render resolution
      # ==========================================================

      - name: Build Super Redux-Redux Performance v6
        shell: bash
        run: |
          set +e

          cd "$GITHUB_WORKSPACE/Butterscotch"

          HASH="$(
            git rev-parse --short HEAD
          )"

          DATE="$(
            git show -s --format=%cs HEAD
          )"

          echo
          echo "======================================"
          echo "SUPER R-R PERFORMANCE v6"
          echo "======================================"
          echo
          echo "ARM64"
          echo "O3"
          echo "Thin LTO"
          echo "Frame pointer OFF"
          echo "High resolution OFF"
          echo "VM GML profiler OFF"
          echo "VM opcode profiler OFF"
          echo "VM tracing OFF"
          echo "VM stub logs OFF"
          echo

          make \
            -j4 \
            OS=iOS \
            CC="$IOS_CC" \
            CFLAGS="-O3 -DNDEBUG -flto=thin -fomit-frame-pointer" \
            LDFLAGS="-flto=thin" \
            DISABLE_WAD14=1 \
            DISABLE_WAD17=1 \
            DISABLE_VM_GML_PROFILER=1 \
            DISABLE_VM_OPCODE_PROFILER=1 \
            DISABLE_VM_STUB_LOGS=1 \
            DISABLE_VM_TRACING=1 \
            BUTTERSCOTCH_COMMIT_HASH="$HASH" \
            BUTTERSCOTCH_COMMIT_DATE="$DATE" \
            2>&1 | tee "$GITHUB_WORKSPACE/performance-v6.log"

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then

            echo
            echo "======================================"
            echo "REAL BUILD ERRORS"
            echo "======================================"

            grep -n -E \
              "error:|fatal error:|ERROR:" \
              "$GITHUB_WORKSPACE/performance-v6.log" \
              | tail -150 \
              || true

            echo "======================================"

            exit "$STATUS"
          fi

          echo
          echo "======================================"
          echo "PERFORMANCE BUILD FINISHED"
          echo "======================================"

          find build \
            -maxdepth 2 \
            -type f \
            -print

      # ==========================================================
      # VERIFY
      # ==========================================================

      - name: Verify IPA
        shell: bash
        run: |
          set -e

          IPA="$GITHUB_WORKSPACE/Butterscotch/build/butterscotch.ipa"

          BIN="$GITHUB_WORKSPACE/Butterscotch/build/butterscotch"

          test -f "$IPA"
          test -f "$BIN"

          echo "Binary:"
          file "$BIN"

          echo
          echo "Architecture:"
          lipo -info "$BIN" || true

          echo
          echo "IPA:"
          ls -lh "$IPA"

          echo
          echo "Bundled data.win:"

          unzip -l "$IPA" \
            | grep -i \
              "BundledGame/data.win"

      # ==========================================================
      # OUTPUT
      # ==========================================================

      - name: Prepare Performance v6
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp \
            "$GITHUB_WORKSPACE/Butterscotch/build/butterscotch.ipa" \
            "$GITHUB_WORKSPACE/output/Super-Redux-Redux-iOS-v6-Performance.ipa"

          cat > "$GITHUB_WORKSPACE/output/README.txt" <<'EOF'
          SUPER REDUX-REDUX iOS v6 PERFORMANCE
          ====================================

          THIS BUILD FOCUSES ON FPS.

          OLD CONTROLS ARE PRESERVED.


          CONTROLS
          --------

          LEFT JOYSTICK
          W/A/S/D movement

          RIGHT LOOK JOYSTICK
          Look / aim around

          TOUCH GAME AREA
          Direct aim / crosshair

          A
          Left mouse
          Punch / shoot
          Enter in menus

          X
          Right mouse
          Pickup / throw weapon

          C
          Space
          Execution / interaction

          R
          Restart after death

          LOOK
          Shift
          Look farther

          LOCK
          Middle mouse
          Target lock

          II
          Escape / Pause


          FPS COUNTER
          -----------

          Small real-time FPS counter remains enabled.


          PERFORMANCE v6
          --------------

          - ARM64 iPhone build
          - O3 optimisation
          - Thin LTO
          - frame pointer omitted
          - high-resolution framebuffer forced OFF
          - GameMaker VM profiler disabled
          - opcode profiler disabled
          - VM tracing disabled
          - VM stub logging disabled
          - game thread UserInteractive QoS
          - VM stack args/locals optimisation attempted
          - safe fallback to old VM if patch conflicts


          IMPORTANT
          ---------

          This build DOES NOT fake the FPS number.

          The displayed FPS is measured from actual
          presented game frames.

          60 FPS is the target, not a guaranteed result.

          Enemy-wall collision and nearest-enemy auto aim
          are not changed in this performance-only build.


          GAME
          ----

          Full Super Redux-Redux is bundled inside IPA.

          IPA is unsigned/ad-hoc.
          Re-sign using your normal sideload method.
          EOF

          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Upload Performance v6 IPA
        uses: actions/upload-artifact@v4
        with:
          name: super-redux-redux-ios-v6-performance
          path: |
            output/Super-Redux-Redux-iOS-v6-Performance.ipa
            output/README.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: redux-ios-v6-performance-failed
          path: |
            Butterscotch/src/ios/main.c
            Butterscotch/src/vm_builtins.c
            Butterscotch/compat/config.mk
            performance-v6.log
          if-no-files-found: ignore
          retention-days: 7
