name: Super Redux-Redux iOS IPA v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 1. DOWNLOAD FULL SUPER REDUX-REDUX FROM OUR GITHUB RELEASE
      # =========================================================

      - name: Download Super Redux-Redux
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/input"

          TAG="$(gh release view \
            --json tagName \
            --jq '.tagName')"

          echo "Latest release: $TAG"

          gh release download "$TAG" \
            --pattern "*.zip" \
            --dir "$GITHUB_WORKSPACE/input"

          ZIP="$(find "$GITHUB_WORKSPACE/input" \
            -type f \
            -iname "*.zip" \
            | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Super Redux-Redux ZIP not found"
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP"

          mkdir -p "$GITHUB_WORKSPACE/game"

          unzip -q "$ZIP" \
            -d "$GITHUB_WORKSPACE/game"

          DATAWIN="$(find "$GITHUB_WORKSPACE/game" \
            -type f \
            -iname "data.win" \
            | head -n 1)"

          if [ -z "$DATAWIN" ]; then
            echo "ERROR: data.win not found"
            exit 1
          fi

          GAME_DIR="$(dirname "$DATAWIN")"

          echo "DATAWIN=$DATAWIN" >> "$GITHUB_ENV"
          echo "GAME_DIR=$GAME_DIR" >> "$GITHUB_ENV"

          echo
          echo "===== GAME DIRECTORY ====="
          echo "$GAME_DIR"

          echo
          echo "===== GAME SIZE ====="
          du -sh "$GAME_DIR"

          echo
          echo "===== GAME FILES ====="
          find "$GAME_DIR" \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -n 150

      # =========================================================
      # 2. DOWNLOAD EXISTING BUTTERSCOTCH iOS PORT
      # =========================================================

      - name: Download Butterscotch iOS port
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch ios \
            https://github.com/Un1q32/Butterscotch.git \
            "$GITHUB_WORKSPACE/Butterscotch"

          cd "$GITHUB_WORKSPACE/Butterscotch"

          echo
          echo "Butterscotch commit:"
          git rev-parse HEAD

      # =========================================================
      # 3. CHECK XCODE / iPHONE SDK
      # =========================================================

      - name: Show Xcode environment
        shell: bash
        run: |
          set -e

          echo "===== XCODE ====="
          xcodebuild -version

          echo
          echo "===== iPHONE SDK ====="
          xcrun --sdk iphoneos --show-sdk-path

          echo
          echo "===== CLANG ====="
          xcrun --sdk iphoneos --find clang

      # =========================================================
      # 4. CREATE ARM64 iPHONE COMPILER
      # =========================================================

      - name: Create iOS compiler wrapper
        shell: bash
        run: |
          set -e

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos --find clang)"

          cat > "$RUNNER_TEMP/ios-clang" <<EOF
          #!/bin/bash
          exec "$CLANG" \
            -target arm64-apple-ios12.0 \
            -arch arm64 \
            -isysroot "$SDK" \
            "\$@"
          EOF

          chmod +x "$RUNNER_TEMP/ios-clang"

          echo "IOS_CC=$RUNNER_TEMP/ios-clang" \
            >> "$GITHUB_ENV"

          "$RUNNER_TEMP/ios-clang" --version

      # =========================================================
      # 5. APP NAME / BUNDLE ID
      # =========================================================

      - name: Customize app information
        shell: bash
        run: |
          set -e

          PLIST="$GITHUB_WORKSPACE/Butterscotch/artifacts/ios/assets/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist missing"
            exit 1
          fi

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName Super R-R" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName Super R-R" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleIdentifier com.negelinho.superrr.ios" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :MinimumOSVersion 12.0" \
            "$PLIST"

          echo
          echo "===== INFO.PLIST ====="
          plutil -p "$PLIST" | head -n 80

      # =========================================================
      # 6. PUT ALL SUPER REDUX-REDUX FILES INSIDE THE IPA
      #    data.win + music + external files + everything else
      # =========================================================

      - name: Bundle complete Super Redux-Redux
        shell: bash
        run: |
          set -e

          BUNDLED="$GITHUB_WORKSPACE/Butterscotch/artifacts/ios/assets/BundledGame"

          rm -rf "$BUNDLED"
          mkdir -p "$BUNDLED"

          rsync -a \
            "$GAME_DIR/" \
            "$BUNDLED/"

          if [ ! -f "$BUNDLED/data.win" ]; then
            echo "ERROR: BundledGame/data.win missing"
            exit 1
          fi

          echo
          echo "===== BUNDLED GAME SIZE ====="
          du -sh "$BUNDLED"

          echo
          echo "===== BUNDLED FILE COUNT ====="
          find "$BUNDLED" -type f | wc -l

          echo
          echo "Full Redux game has been bundled."

      # =========================================================
      # 7. COPY BUNDLED GAME TO DOCUMENTS ON FIRST LAUNCH
      # =========================================================

      - name: Add automatic first-launch installer
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          python3 <<'PY'
          from pathlib import Path

          p = Path("Butterscotch/src/ios/main.c")
          s = p.read_text()

          needle = '''
              gameListVC = [[BSGameListViewController alloc] init];
          '''

          patch = r'''
              /*
               * Super Redux-Redux iOS:
               * Install bundled game automatically on first launch.
               */

              @autoreleasepool {

                  NSFileManager *fm =
                      [NSFileManager defaultManager];

                  NSArray *roots =
                      bsGamesRootsToScan();

                  if ([roots count] > 0) {

                      NSString *root =
                          [roots objectAtIndex:0];

                      NSString *gamesDir =
                          [root stringByAppendingPathComponent:
                              @"games"];

                      NSString *gameDest =
                          [gamesDir stringByAppendingPathComponent:
                              @"Super R-R"];

                      NSString *dataDest =
                          [gameDest stringByAppendingPathComponent:
                              @"data.win"];

                      if (![fm fileExistsAtPath:dataDest]) {

                          NSString *source =
                              [[[NSBundle mainBundle] resourcePath]
                                  stringByAppendingPathComponent:
                                      @"BundledGame"];

                          NSError *mkdirError = nil;

                          [fm createDirectoryAtPath:gamesDir
                              withIntermediateDirectories:YES
                                               attributes:nil
                                                    error:&mkdirError];

                          if (mkdirError) {

                              NSLog(
                                  @"Super R-R: games directory error: %@",
                                  mkdirError
                              );

                          } else {

                              NSError *copyError = nil;

                              BOOL copied =
                                  [fm copyItemAtPath:source
                                             toPath:gameDest
                                              error:&copyError];

                              if (!copied) {

                                  NSLog(
                                      @"Super R-R: copy failed: %@",
                                      copyError
                                  );

                              } else {

                                  NSLog(
                                      @"Super R-R installed successfully."
                                  );
                              }
                          }
                      }
                  }
              }

              gameListVC =
                  [[BSGameListViewController alloc] init];
          '''

          if needle not in s:
              raise SystemExit(
                  "ERROR: startup marker not found"
              )

          s = s.replace(
              needle,
              patch,
              1
          )

          p.write_text(s)

          print(
              "First-launch Super R-R installer added."
          )
          PY

      # =========================================================
      # 8. REDUX CONTROL FIX
      #
      # Joystick:
      #   UP    -> W
      #   DOWN  -> S
      #   LEFT  -> A
      #   RIGHT -> D
      #
      # First action button:
      #   SPACE
      #
      # Redux maps SPACE -> ENTER in title menu,
      # therefore START GAME can be selected.
      # SPACE is also useful inside gameplay.
      # =========================================================

      - name: Patch Redux touch controls
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          python3 <<'PY'
          from pathlib import Path

          p = Path("Butterscotch/src/ios/main.c")
          s = p.read_text()

          # -----------------------------------------
          # Z BUTTON -> SPACE
          # -----------------------------------------

          old_button = (
              '_actionButtons[0] = '
              '[[BSKeyButton alloc] '
              'initWithFrame:CGRectZero '
              "key:'Z' "
              'label:@"Z" '
              'font:18.0f '
              'hitExpansion:6.0f];'
          )

          new_button = (
              '_actionButtons[0] = '
              '[[BSKeyButton alloc] '
              'initWithFrame:CGRectZero '
              'key:VK_SPACE '
              'label:@"A" '
              'font:18.0f '
              'hitExpansion:12.0f];'
          )

          if old_button not in s:
              raise SystemExit(
                  "ERROR: original Z button not found"
              )

          s = s.replace(
              old_button,
              new_button,
              1
          )

          # -----------------------------------------
          # DPAD ARROWS -> W S A D
          # There are two key arrays in BSDpad:
          # one for release and one for movement.
          # -----------------------------------------

          old_dpad = (
              'static const int32_t keys[4] = '
              '{ VK_UP, VK_DOWN, VK_LEFT, VK_RIGHT };'
          )

          new_dpad = (
              "static const int32_t keys[4] = "
              "{ 'W', 'S', 'A', 'D' };"
          )

          count = s.count(old_dpad)

          if count < 2:
              raise SystemExit(
                  f"ERROR: expected two D-pad mappings, found {count}"
              )

          s = s.replace(
              old_dpad,
              new_dpad
          )

          p.write_text(s)

          print("Redux controls patched:")
          print("  joystick = W/A/S/D")
          print("  A button = SPACE / menu select")
          PY

          echo
          echo "===== CONTROL PATCH CHECK ====="

          grep -n \
            "label:@\"A\"" \
            "$GITHUB_WORKSPACE/Butterscotch/src/ios/main.c"

          grep -n \
            "{ 'W', 'S', 'A', 'D' }" \
            "$GITHUB_WORKSPACE/Butterscotch/src/ios/main.c"

      # =========================================================
      # 9. CLEAN OLD BUILD
      # =========================================================

      - name: Clean Butterscotch
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/Butterscotch"

          make distclean || true

      # =========================================================
      # 10. BUILD REAL iPHONE ARM64 APP + IPA
      # =========================================================

      - name: Build Super Redux-Redux for iOS
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/Butterscotch"

          COMMIT_HASH="$(
            git rev-parse --short HEAD
          )"

          COMMIT_DATE="$(
            git show -s --format=%cs HEAD
          )"

          make \
            -j3 \
            OS=iOS \
            CC="$IOS_CC" \
            DISABLE_WAD14=1 \
            DISABLE_WAD17=1 \
            DISABLE_VM_GML_PROFILER=1 \
            DISABLE_VM_OPCODE_PROFILER=1 \
            DISABLE_VM_STUB_LOGS=1 \
            DISABLE_VM_TRACING=1 \
            BUTTERSCOTCH_COMMIT_HASH="$COMMIT_HASH" \
            BUTTERSCOTCH_COMMIT_DATE="$COMMIT_DATE"

          echo
          echo "===== BUILD DIRECTORY ====="

          find build \
            -maxdepth 2 \
            -type f \
            -print

      # =========================================================
      # 11. VERIFY IPA + ARM64
      # =========================================================

      - name: Verify iOS build
        shell: bash
        run: |
          set -e

          BIN="$GITHUB_WORKSPACE/Butterscotch/build/butterscotch"
          IPA="$GITHUB_WORKSPACE/Butterscotch/build/butterscotch.ipa"

          if [ ! -f "$BIN" ]; then
            echo "ERROR: ARM64 executable missing"
            exit 1
          fi

          if [ ! -f "$IPA" ]; then
            echo "ERROR: IPA missing"
            exit 1
          fi

          echo
          echo "===== EXECUTABLE ====="
          file "$BIN"

          echo
          echo "===== ARCHITECTURE ====="
          lipo -info "$BIN" || true

          echo
          echo "===== IPA SIZE ====="
          ls -lh "$IPA"

          echo
          echo "===== IPA CONTENTS ====="
          unzip -l "$IPA" \
            | head -n 80

          echo
          echo "===== CHECK BUNDLED DATA.WIN ====="

          unzip -l "$IPA" \
            | grep -i \
              "BundledGame/data.win"

      # =========================================================
      # 12. CREATE FINAL OUTPUT
      # =========================================================

      - name: Prepare Redux iOS v2
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp \
            "$GITHUB_WORKSPACE/Butterscotch/build/butterscotch.ipa" \
            "$GITHUB_WORKSPACE/output/Super-Redux-Redux-iOS-v2.ipa"

          cat > "$GITHUB_WORKSPACE/output/README.txt" <<'EOF'
          SUPER REDUX-REDUX iOS v2
          ========================

          iPhone ARM64 build.

          INCLUDED:
          - Super Redux-Redux data.win
          - complete game folder
          - music and external game files
          - automatic first-launch game installation
          - W/A/S/D touch joystick
          - A button = SPACE
          - SPACE works as menu confirmation in Redux
          - iOS Butterscotch runner

          IMPORTANT:
          This IPA is unsigned/ad-hoc.
          Your sideloading method may need to re-sign it.

          CURRENT CONTROL TEST:
          Left joystick:
            W / A / S / D

          A:
            SPACE
            menu confirm / START GAME

          X:
            X key

          C:
            C key

          NEXT CONTROL WORK:
          touchscreen mouse aiming
          left-click attack
          right-click pickup / throw
          EOF

          echo
          echo "===== FINAL FILES ====="

          ls -lh "$GITHUB_WORKSPACE/output"

      # =========================================================
      # 13. UPLOAD IPA
      # =========================================================

      - name: Upload Super Redux-Redux iOS v2
        uses: actions/upload-artifact@v4
        with:
          name: super-redux-redux-ios-v2
          path: |
            output/Super-Redux-Redux-iOS-v2.ipa
            output/README.txt
          if-no-files-found: error
          retention-days: 7

      # =========================================================
      # 14. SAVE DEBUG FILES IF BUILD FAILS
      # =========================================================

      - name: Upload failed iOS build information
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: redux-ios-v2-failed
          path: |
            Butterscotch/compat/config.mk
            Butterscotch/compat/tmp/
            Butterscotch/src/ios/main.c
          if-no-files-found: ignore
          retention-days: 7
