name: Super Redux-Redux iOS FPS Diagnosis v9 FIXED 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # GAME
      # ==========================================================

      - name: Download Super Redux-Redux
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/input"

          TAG="$(gh release view \
            --json tagName \
            --jq '.tagName')"

          echo "Release: $TAG"

          gh release download "$TAG" \
            --pattern "*.zip" \
            --dir "$GITHUB_WORKSPACE/input"

          ZIP="$(find "$GITHUB_WORKSPACE/input" \
            -type f \
            -iname "*.zip" \
            | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Redux ZIP not found"
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/game"
          mkdir -p "$GITHUB_WORKSPACE/game"

          unzip -q "$ZIP" \
            -d "$GITHUB_WORKSPACE/game"

          DATAWIN="$(find "$GITHUB_WORKSPACE/game" \
            -type f \
            -iname "data.win" \
            | head -n 1)"

          if [ -z "$DATAWIN" ]; then
            echo "ERROR: data.win not found"
            exit 1
          fi

          GAME_DIR="$(dirname "$DATAWIN")"

          echo "DATAWIN=$DATAWIN" >> "$GITHUB_ENV"
          echo "GAME_DIR=$GAME_DIR" >> "$GITHUB_ENV"

          echo "Game:"
          echo "$GAME_DIR"

          du -sh "$GAME_DIR"

      # ==========================================================
      # BUTTERSCOTCH
      # ==========================================================

      - name: Download Butterscotch iOS
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch ios \
            https://github.com/Un1q32/Butterscotch.git \
            "$GITHUB_WORKSPACE/Butterscotch"

          cd "$GITHUB_WORKSPACE/Butterscotch"

          echo "Butterscotch:"
          git rev-parse HEAD

      # ==========================================================
      # GL + VM PERFORMANCE
      # ==========================================================

      - name: Apply GL and VM performance patches
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/Butterscotch"

          git remote remove upstream 2>/dev/null || true

          git remote add upstream \
            https://github.com/ButterscotchRunner/Butterscotch.git

          echo
          echo "======================================"
          echo "GL PERFORMANCE"
          echo "======================================"

          GL_BEFORE="$(git rev-parse HEAD)"

          if git fetch \
              --depth 50 \
              upstream \
              refs/pull/379/head:perf-gl-379; then

            GL_OK=1

            for C in \
              dad0d13 \
              b396c33 \
              c5d4eba
            do

              if git merge-base \
                  --is-ancestor \
                  "$C" \
                  HEAD 2>/dev/null; then

                echo "$C already included"
                continue
              fi

              echo "Applying $C"

              if ! git cherry-pick "$C"; then

                git cherry-pick --abort || true
                git reset --hard "$GL_BEFORE"

                GL_OK=0
                break
              fi

            done

            if [ "$GL_OK" = "1" ]; then
              echo "GL optimization enabled."
            else
              echo "GL optimization skipped."
            fi

          else

            git reset --hard "$GL_BEFORE"
            echo "GL optimization unavailable."
          fi

          echo
          echo "======================================"
          echo "VM PERFORMANCE"
          echo "======================================"

          VM_BEFORE="$(git rev-parse HEAD)"

          if git fetch \
              --depth 50 \
              upstream \
              refs/pull/372/head:perf-vm-372; then

            VM_OK=1

            for C in \
              e51a6d5 \
              20bc047
            do

              if git merge-base \
                  --is-ancestor \
                  "$C" \
                  HEAD 2>/dev/null; then

                echo "$C already included"
                continue
              fi

              echo "Applying $C"

              if ! git cherry-pick "$C"; then

                git cherry-pick --abort || true
                git reset --hard "$VM_BEFORE"

                VM_OK=0
                break
              fi

            done

            if [ "$VM_OK" = "1" ]; then
              echo "VM optimization enabled."
            else
              echo "VM optimization skipped."
            fi

          else

            git reset --hard "$VM_BEFORE"
            echo "VM optimization unavailable."
          fi

          git log --oneline -10

      # ==========================================================
      # COMPILER
      # ==========================================================

      - name: Prepare iPhone compiler
        shell: bash
        run: |
          set -e

          xcodebuild -version

          SDK="$(xcrun \
            --sdk iphoneos \
            --show-sdk-path)"

          CLANG="$(xcrun \
            --sdk iphoneos \
            --find clang)"

          cat > "$RUNNER_TEMP/ios-clang" <<EOF
          #!/bin/bash
          exec "$CLANG" \
            -target arm64-apple-ios12.0 \
            -arch arm64 \
            -isysroot "$SDK" \
            "\$@"
          EOF

          chmod +x "$RUNNER_TEMP/ios-clang"

          echo "IOS_CC=$RUNNER_TEMP/ios-clang" \
            >> "$GITHUB_ENV"

      # ==========================================================
      # APP INFO
      # ==========================================================

      - name: Set app info
        shell: bash
        run: |
          set -e

          PLIST="$GITHUB_WORKSPACE/Butterscotch/artifacts/ios/assets/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName Super R-R" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName Super R-R" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleIdentifier com.negelinho.superrr.ios" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :MinimumOSVersion 12.0" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :UIFileSharingEnabled bool true" \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Set :UIFileSharingEnabled true" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :LSSupportsOpeningDocumentsInPlace bool true" \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Set :LSSupportsOpeningDocumentsInPlace true" \
            "$PLIST"

      # ==========================================================
      # GAME DATA
      # ==========================================================

      - name: Bundle complete Super Redux-Redux
        shell: bash
        run: |
          set -e

          BUNDLED="$GITHUB_WORKSPACE/Butterscotch/artifacts/ios/assets/BundledGame"

          rm -rf "$BUNDLED"
          mkdir -p "$BUNDLED"

          rsync -a \
            "$GAME_DIR/" \
            "$BUNDLED/"

          test -f "$BUNDLED/data.win"

          echo "Bundled:"
          du -sh "$BUNDLED"

          echo "Files:"
          find "$BUNDLED" -type f | wc -l

      # ==========================================================
      # REDUX RENDERING
      # ==========================================================

      - name: Patch Redux rendering
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          python3 <<'PY'
          from pathlib import Path

          p = Path("Butterscotch/src/vm_builtins.c")
          s = p.read_text()

          room_marker = "// ===[ ROOM FUNCTIONS ]==="

          if room_marker not in s:
              raise SystemExit(
                  "ERROR: room marker not found"
              )

          extra = r'''
          static RValue builtin_d3d_set_projection_ortho(
              VMContext* ctx,
              RValue* args,
              int32_t argCount
          ) {
              if (argCount < 5)
                  return RValue_makeUndefined();

              Runner* runner =
                  ctx->runner;

              if (runner == nullptr ||
                  runner->renderer == nullptr)
                  return RValue_makeUndefined();

              float x =
                  (float)RValue_toReal(args[0]);

              float y =
                  (float)RValue_toReal(args[1]);

              float width =
                  (float)RValue_toReal(args[2]);

              float height =
                  (float)RValue_toReal(args[3]);

              float angle =
                  (float)RValue_toReal(args[4]);

              if (width <= 0.0f ||
                  height <= 0.0f)
                  return RValue_makeUndefined();

              Matrix4f view;
              Matrix4f projection;

              Matrix4f_identity(
                  &view
              );

              Matrix4f_viewProjection(
                  &projection,
                  x,
                  y,
                  width,
                  height,
                  angle
              );

              runner
                  ->renderer
                  ->vtable
                  ->applyProjection(
                      runner->renderer,
                      &view,
                      &projection
                  );

              return RValue_makeUndefined();
          }


          static RValue builtin_room_set_view(
              VMContext* ctx,
              RValue* args,
              int32_t argCount
          ) {
              if (argCount < 16)
                  return RValue_makeUndefined();

              Runner* runner =
                  ctx->runner;

              DataWin* dw =
                  ctx->dataWin;

              int32_t roomId =
                  RValue_toInt32(
                      args[0]
                  );

              int32_t viewId =
                  RValue_toInt32(
                      args[1]
                  );

              if (roomId < 0 ||
                  (uint32_t)roomId >=
                      dw->room.count ||
                  viewId < 0 ||
                  viewId >= MAX_VIEWS)
                  return RValue_makeUndefined();

              DataWin_loadRoomPayload(
                  dw,
                  roomId
              );

              Room* room =
                  &dw->room.rooms[
                      roomId
                  ];

              if (room->views == nullptr)
                  return RValue_makeUndefined();

              RoomView* v =
                  &room->views[
                      viewId
                  ];

              v->enabled =
                  RValue_toBool(
                      args[2]
                  );

              v->viewX =
                  RValue_toInt32(
                      args[3]
                  );

              v->viewY =
                  RValue_toInt32(
                      args[4]
                  );

              v->viewWidth =
                  RValue_toInt32(
                      args[5]
                  );

              v->viewHeight =
                  RValue_toInt32(
                      args[6]
                  );

              v->portX =
                  RValue_toInt32(
                      args[7]
                  );

              v->portY =
                  RValue_toInt32(
                      args[8]
                  );

              v->portWidth =
                  RValue_toInt32(
                      args[9]
                  );

              v->portHeight =
                  RValue_toInt32(
                      args[10]
                  );

              v->borderX =
                  (uint32_t)
                  RValue_toInt32(
                      args[11]
                  );

              v->borderY =
                  (uint32_t)
                  RValue_toInt32(
                      args[12]
                  );

              v->speedX =
                  RValue_toInt32(
                      args[13]
                  );

              v->speedY =
                  RValue_toInt32(
                      args[14]
                  );

              v->objectId =
                  RValue_toInt32(
                      args[15]
                  );

              if (v->enabled)
                  room->flags |= 1;

              if (runner != nullptr &&
                  runner->currentRoomIndex ==
                      roomId) {

                  runner->viewsEnabled =
                      (room->flags & 1) != 0;

                  RuntimeView* rv =
                      &runner->views[
                          viewId
                      ];

                  rv->enabled =
                      v->enabled;

                  rv->portX =
                      v->portX;

                  rv->portY =
                      v->portY;

                  rv->portWidth =
                      v->portWidth;

                  rv->portHeight =
                      v->portHeight;

                  rv->cameraId =
                      viewId;

                  GMLCamera* camera =
                      &runner
                          ->defaultCameras[
                              viewId
                          ];

                  camera->allocated =
                      true;

                  camera->viewX =
                      (float)v->viewX;

                  camera->viewY =
                      (float)v->viewY;

                  camera->viewWidth =
                      v->viewWidth;

                  camera->viewHeight =
                      v->viewHeight;

                  camera->borderX =
                      v->borderX;

                  camera->borderY =
                      v->borderY;

                  camera->speedX =
                      v->speedX;

                  camera->speedY =
                      v->speedY;

                  camera->objectId =
                      v->objectId;

                  camera->viewAngle =
                      0.0f;

                  Runner_updateCameraViewSimple(
                      camera
                  );
              }

              return RValue_makeUndefined();
          }

          '''

          s = s.replace(
              room_marker,
              extra +
              "\n" +
              room_marker,
              1
          )

          display_marker = (
              "// Display stubs"
          )

          if display_marker not in s:
              raise SystemExit(
                  "ERROR: display marker missing"
              )

          mouse_code = r'''
          static RValue builtin_display_mouse_get_x(
              VMContext* ctx,
              MAYBE_UNUSED RValue* args,
              MAYBE_UNUSED int32_t argCount
          ) {
              Runner* runner =
                  ctx->runner;

              if (runner == nullptr ||
                  runner->mouse == nullptr)
                  return RValue_makeReal(
                      320.0
                  );

              return RValue_makeReal(
                  runner
                      ->mouse
                      ->normalizedX *
                  640.0
              );
          }


          static RValue builtin_display_mouse_get_y(
              VMContext* ctx,
              MAYBE_UNUSED RValue* args,
              MAYBE_UNUSED int32_t argCount
          ) {
              Runner* runner =
                  ctx->runner;

              if (runner == nullptr ||
                  runner->mouse == nullptr)
                  return RValue_makeReal(
                      240.0
                  );

              return RValue_makeReal(
                  runner
                      ->mouse
                      ->normalizedY *
                  480.0
              );
          }


          static RValue builtin_window_mouse_get_x(
              VMContext* ctx,
              MAYBE_UNUSED RValue* args,
              MAYBE_UNUSED int32_t argCount
          ) {
              Runner* runner =
                  ctx->runner;

              if (runner == nullptr ||
                  runner->mouse == nullptr)
                  return RValue_makeReal(
                      0.0
                  );

              return RValue_makeReal(
                  runner
                      ->mouse
                      ->screenX
              );
          }


          static RValue builtin_window_mouse_get_y(
              VMContext* ctx,
              MAYBE_UNUSED RValue* args,
              MAYBE_UNUSED int32_t argCount
          ) {
              Runner* runner =
                  ctx->runner;

              if (runner == nullptr ||
                  runner->mouse == nullptr)
                  return RValue_makeReal(
                      0.0
                  );

              return RValue_makeReal(
                  runner
                      ->mouse
                      ->screenY
              );
          }


          static RValue builtin_window_mouse_set(
              MAYBE_UNUSED VMContext* ctx,
              MAYBE_UNUSED RValue* args,
              MAYBE_UNUSED int32_t argCount
          ) {
              return RValue_makeUndefined();
          }

          '''

          s = s.replace(
              display_marker,
              mouse_code +
              "\n" +
              display_marker,
              1
          )

          reg = (
              'VM_registerBuiltin(ctx, '
              '"matrix_build_projection_ortho", '
              'builtin_matrix_build_projection_ortho);'
          )

          if reg not in s:
              raise SystemExit(
                  "ERROR: matrix registration missing"
              )

          s = s.replace(
              reg,
              reg +
              '\n'
              '    VM_registerBuiltin(ctx, '
              '"d3d_set_projection_ortho", '
              'builtin_d3d_set_projection_ortho);',
              1
          )

          reg = (
              'VM_registerBuiltin(ctx, '
              '"room_exists", '
              'builtin_room_exists);'
          )

          if reg not in s:
              raise SystemExit(
                  "ERROR: room registration missing"
              )

          s = s.replace(
              reg,
              reg +
              '\n'
              '    VM_registerBuiltin(ctx, '
              '"room_set_view", '
              'builtin_room_set_view);',
              1
          )

          reg = (
              'VM_registerBuiltin(ctx, '
              '"display_get_height", '
              'builtin_display_get_height);'
          )

          if reg not in s:
              raise SystemExit(
                  "ERROR: display registration missing"
              )

          s = s.replace(
              reg,
              reg +
              '\n'
              '    VM_registerBuiltin(ctx, '
              '"display_mouse_get_x", '
              'builtin_display_mouse_get_x);\n'
              '    VM_registerBuiltin(ctx, '
              '"display_mouse_get_y", '
              'builtin_display_mouse_get_y);\n'
              '    VM_registerBuiltin(ctx, '
              '"window_mouse_get_x", '
              'builtin_window_mouse_get_x);\n'
              '    VM_registerBuiltin(ctx, '
              '"window_mouse_get_y", '
              'builtin_window_mouse_get_y);\n'
              '    VM_registerBuiltin(ctx, '
              '"window_mouse_set", '
              'builtin_window_mouse_set);',
              1
          )

          p.write_text(s)

          print(
              "Rendering patch complete."
          )
          PY

      # ==========================================================
      # TOUCH CONTROLS
      # ==========================================================

      - name: Patch Redux gameplay controls
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "Butterscotch/src/ios/main.c"
          )

          s = p.read_text()

          marker = '''/* ---------------------------------------------------------------------
           * Game Controller (GCController / GCExtendedGamepad) support.'''

          if marker not in s:
              raise SystemExit(
                  "ERROR: controller marker missing"
              )

          mouse_queue = r'''
          #define BS_MOUSE_QUEUE_SIZE 32

          typedef struct {
              int32_t button;
              bool isDown;
          } BSMouseEvent;

          static BSMouseEvent
              bsMouseQueue[
                  BS_MOUSE_QUEUE_SIZE
              ];

          static atomic_int
              bsMouseQueueHead = 0;

          static atomic_int
              bsMouseQueueTail = 0;

          static _Atomic double
              bsTouchMouseX = 320.0;

          static _Atomic double
              bsTouchMouseY = 240.0;


          static void bsEnqueueMouseEvent(
              int32_t button,
              bool isDown
          ) {
              int head =
                  atomic_load(
                      &bsMouseQueueHead
                  );

              int next =
                  (head + 1) %
                  BS_MOUSE_QUEUE_SIZE;

              if (next ==
                  atomic_load(
                      &bsMouseQueueTail
                  ))
                  return;

              bsMouseQueue[
                  head
              ].button =
                  button;

              bsMouseQueue[
                  head
              ].isDown =
                  isDown;

              atomic_store(
                  &bsMouseQueueHead,
                  next
              );
          }


          static void bsDrainMouseEvents(
              void
          ) {
              for (;;) {

                  int tail =
                      atomic_load(
                          &bsMouseQueueTail
                      );

                  if (tail ==
                      atomic_load(
                          &bsMouseQueueHead
                      ))
                      break;

                  BSMouseEvent ev =
                      bsMouseQueue[
                          tail
                      ];

                  atomic_store(
                      &bsMouseQueueTail,
                      (tail + 1) %
                      BS_MOUSE_QUEUE_SIZE
                  );

                  if (g_runner &&
                      g_runner->mouse) {

                      if (ev.isDown) {

                          RunnerMouse_onButtonDown(
                              g_runner->mouse,
                              ev.button
                          );

                      } else {

                          RunnerMouse_onButtonUp(
                              g_runner->mouse,
                              ev.button
                          );
                      }
                  }
              }
          }

          '''

          s = s.replace(
              marker,
              mouse_queue +
              marker,
              1
          )

          old_mouse = '''/* TODO: touchscreen mouse support */
          void platformGetMousePos(double *xPos, double *yPos) {
              *xPos = 0.0;
              *yPos = 0.0;
          }'''

          new_mouse = '''void platformGetMousePos(double *xPos, double *yPos) {
              *xPos = atomic_load(&bsTouchMouseX);
              *yPos = atomic_load(&bsTouchMouseY);
          }'''

          if old_mouse not in s:
              raise SystemExit(
                  "ERROR: platformGetMousePos missing"
              )

          s = s.replace(
              old_mouse,
              new_mouse,
              1
          )

          old_events = '''bool platformHandleEvents(void) {
              bsPollGameControllers();
              bsDrainKeyEvents();'''

          new_events = '''bool platformHandleEvents(void) {
              bsPollGameControllers();
              bsDrainKeyEvents();
              bsDrainMouseEvents();'''

          if old_events not in s:
              raise SystemExit(
                  "ERROR: event loop missing"
              )

          s = s.replace(
              old_events,
              new_events,
              1
          )

          action_marker = '''static void actionButtonRects(CGRect bf, CGRect out[3]) {'''

          if action_marker not in s:
              raise SystemExit(
                  "ERROR: action marker missing"
              )

          helper = r'''
          static void bsSetMouseFromTouchPoint(
              CGPoint p,
              CGRect gameFrame
          ) {
              if (gameFrame.size.width <= 0.0f ||
                  gameFrame.size.height <= 0.0f)
                  return;

              CGFloat nx =
                  (p.x -
                   gameFrame.origin.x) /
                  gameFrame.size.width;

              CGFloat ny =
                  (p.y -
                   gameFrame.origin.y) /
                  gameFrame.size.height;

              if (nx < 0.0f)
                  nx = 0.0f;

              if (nx > 1.0f)
                  nx = 1.0f;

              if (ny < 0.0f)
                  ny = 0.0f;

              if (ny > 1.0f)
                  ny = 1.0f;

              CGRect screen =
                  [[UIScreen mainScreen]
                      bounds];

              atomic_store(
                  &bsTouchMouseX,
                  (double)(
                      nx *
                      screen.size.width
                  )
              );

              atomic_store(
                  &bsTouchMouseY,
                  (double)(
                      ny *
                      screen.size.height
                  )
              );
          }

          '''

          s = s.replace(
              action_marker,
              helper +
              action_marker,
              1
          )

          interface_marker = '''@interface BSQuitButton : BSButton
          @end'''

          interface = r'''
          @interface BSActionButton : BSButton {
              int32_t _mouseButton;
              int32_t _key;
          }

          - (id)initWithFrame:(CGRect)frame
                  mouseButton:(int32_t)mouseButton
                          key:(int32_t)key
                        label:(NSString *)label
                         font:(CGFloat)fontSize
                 hitExpansion:(CGFloat)expansion;

          @end

          '''

          if interface_marker not in s:
              raise SystemExit(
                  "ERROR: button interface missing"
              )

          s = s.replace(
              interface_marker,
              interface +
              interface_marker,
              1
          )

          action_decl = (
              'BSKeyButton      *_actionButtons[3];'
          )

          if action_decl not in s:
              raise SystemExit(
                  "ERROR: action declaration missing"
              )

          s = s.replace(
              action_decl,
              'BSActionButton   *_actionButtons[3];',
              1
          )

          old = '''    BOOL              keyboardConnected;
          }'''

          new = '''    BOOL              keyboardConnected;
              UITouch          *_aimTouch;
          }'''

          if old not in s:
              raise SystemExit(
                  "ERROR: overlay marker missing"
              )

          s = s.replace(
              old,
              new,
              1
          )

          old = '''        _actionButtons[0] = [[BSKeyButton alloc] initWithFrame:CGRectZero key:'Z' label:@"Z" font:18.0f hitExpansion:6.0f];
                  _actionButtons[1] = [[BSKeyButton alloc] initWithFrame:CGRectZero key:'X' label:@"X" font:18.0f hitExpansion:6.0f];
                  _actionButtons[2] = [[BSKeyButton alloc] initWithFrame:CGRectZero key:'C' label:@"C" font:18.0f hitExpansion:6.0f];'''

          new = '''        _actionButtons[0] = [[BSActionButton alloc]
                      initWithFrame:CGRectZero
                      mouseButton:GML_MB_LEFT
                      key:VK_ENTER
                      label:@"A"
                      font:18.0f
                      hitExpansion:12.0f];

                  _actionButtons[1] = [[BSActionButton alloc]
                      initWithFrame:CGRectZero
                      mouseButton:GML_MB_RIGHT
                      key:-1
                      label:@"X"
                      font:18.0f
                      hitExpansion:12.0f];

                  _actionButtons[2] = [[BSActionButton alloc]
                      initWithFrame:CGRectZero
                      mouseButton:GML_MB_NONE
                      key:VK_SPACE
                      label:@"C"
                      font:18.0f
                      hitExpansion:12.0f];

                  _aimTouch = nil;'''

          if old not in s:
              raise SystemExit(
                  "ERROR: original buttons missing"
              )

          s = s.replace(
              old,
              new,
              1
          )

          old_dpad = (
              'static const int32_t keys[4] = '
              '{ VK_UP, VK_DOWN, VK_LEFT, VK_RIGHT };'
          )

          count = s.count(
              old_dpad
          )

          if count < 2:
              raise SystemExit(
                  f"ERROR: dpad maps missing: {count}"
              )

          s = s.replace(
              old_dpad,
              "static const int32_t keys[4] = "
              "{ 'W', 'S', 'A', 'D' };"
          )

          old = '''        for (int i = 0; i < 3; i++) {
                      if ([_actionButtons[i] handleTouchBegan:touch point:p]) break;
                  }'''

          new = '''        BOOL actionHandled =
                      NO;

                  for (int i = 0;
                       i < 3;
                       i++) {

                      if ([_actionButtons[i]
                              handleTouchBegan:
                                  touch
                              point:
                                  p]) {

                          actionHandled =
                              YES;

                          break;
                      }
                  }

                  if (actionHandled)
                      continue;

                  BSLayout layout =
                      computeLayout(
                          self.bounds.size
                      );

                  if (!_aimTouch &&
                      CGRectContainsPoint(
                          layout.gameFrame,
                          p
                      )) {

                      _aimTouch =
                          [touch retain];

                      bsSetMouseFromTouchPoint(
                          p,
                          layout.gameFrame
                      );
                  }'''

          if old not in s:
              raise SystemExit(
                  "ERROR: touch begin missing"
              )

          s = s.replace(
              old,
              new,
              1
          )

          old = '''    for (UITouch *touch in touches) {
                  CGPoint p = [touch locationInView:self];
                  if ([_dpad handleTouchMoved:touch point:p]) {
                      [self setNeedsDisplay];
                      break;
                  }
              }'''

          new = '''    for (UITouch *touch in touches) {

                  CGPoint p =
                      [touch
                          locationInView:
                              self];

                  if ([_dpad
                          handleTouchMoved:
                              touch
                          point:
                              p]) {

                      [self
                          setNeedsDisplay];

                      continue;
                  }

                  if (touch ==
                      _aimTouch) {

                      BSLayout layout =
                          computeLayout(
                              self.bounds.size
                          );

                      bsSetMouseFromTouchPoint(
                          p,
                          layout.gameFrame
                      );
                  }
              }'''

          if old not in s:
              raise SystemExit(
                  "ERROR: touch move missing"
              )

          s = s.replace(
              old,
              new,
