name: Super R-R iOS v11.8 - CRASH FIX + SAFE DIRECT + NEW ICON

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ios:
    name: Build Super R-R v11.8 IPA
    runs-on: macos-14
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # RECOVER THE OLD WORKING BASE
      # ==========================================================

      - name: Recover known-good Super R-R base
        shell: bash
        run: |
          set -euo pipefail

          BASE="$RUNNER_TEMP/redux_known_good.yml"
          BASE_COMMIT="57b87ada673b83c7e2f9b0c91582d0109dae580d"

          git cat-file -e "${BASE_COMMIT}^{commit}"

          git show \
            "${BASE_COMMIT}:.github/workflows/redux_ios_build.yml" \
            > "$BASE"

          test -s "$BASE"

          echo "BASE_WORKFLOW=$BASE" >> "$GITHUB_ENV"

          echo "Recovered:"
          grep -n '^      - name:' "$BASE" | head -80

      # ==========================================================
      # PIN THE SAME IOS RUNNER USED BY THE WORKING V11.5 BUILD
      # ==========================================================

      - name: Pin known-good Butterscotch iOS revision
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$BASE_WORKFLOW" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])

          lines = p.read_text(
              encoding="utf-8"
          ).splitlines()

          out = []
          inside = False
          inserted = False

          pin_lines = [
              "",
              "          # v11.8: lock to the exact iOS runner used by v11.5",
              '          PIN="4c1a9ca6555b32ab84a09be9351ae1946fa0648b"',
              "",
              "          git fetch --depth 200 origin ios || true",
              "",
              '          if ! git cat-file -e "$PIN^{commit}" 2>/dev/null; then',
              "            git fetch --unshallow origin ios || git fetch origin ios",
              "          fi",
              "",
              '          git checkout --detach "$PIN"',
              "",
              '          ACTUAL="$(git rev-parse HEAD)"',
              '          echo "Pinned Butterscotch: $ACTUAL"',
              "",
              '          if [ "$ACTUAL" != "$PIN" ]; then',
              '            echo "ERROR: wrong Butterscotch commit"',
              "            exit 1",
              "          fi",
          ]

          for line in lines:

              if line.rstrip() == \
                  "      - name: Download Butterscotch iOS":
                  inside = True

              elif (
                  inside
                  and line.startswith("      - name: ")
              ):
                  inside = False

              out.append(line)

              if (
                  inside
                  and not inserted
                  and line.strip()
                      == 'cd "$GITHUB_WORKSPACE/Butterscotch"'
              ):
                  out.extend(pin_lines)
                  inserted = True

          if not inserted:
              raise SystemExit(
                  "ERROR: could not insert Butterscotch pin"
              )

          p.write_text(
              "\n".join(out) + "\n",
              encoding="utf-8"
          )

          print(
              "Known-good Butterscotch pin inserted."
          )
          PY

      # ==========================================================
      # RUN ALL OLD WORKING SUPER R-R PATCHES
      # ==========================================================

      - name: Apply known-good Super R-R patches
        shell: bash
        run: |
          set -euo pipefail

          BASE="$BASE_WORKFLOW"

          reload_env() {

            if [ -f "$GITHUB_ENV" ]; then

              while IFS= read -r LINE; do

                case "$LINE" in
                  *=*)
                    KEY="${LINE%%=*}"

                    case "$KEY" in
                      *[!A-Za-z0-9_]*|'')
                        ;;
                      *)
                        export "$LINE"
                        ;;
                    esac
                    ;;
                esac

              done < "$GITHUB_ENV"

            fi
          }

          run_old_step() {

            STEP_NAME="$1"
            SCRIPT="$RUNNER_TEMP/redux-step.sh"

            echo
            echo "========================================"
            echo "RUN: $STEP_NAME"
            echo "========================================"

            python3 \
              - "$BASE" "$STEP_NAME" "$SCRIPT" \
              <<'PY'
          from pathlib import Path
          import sys

          workflow = Path(sys.argv[1])
          wanted = sys.argv[2]
          output = Path(sys.argv[3])

          lines = workflow.read_text(
              encoding="utf-8"
          ).splitlines()

          target = \
              "      - name: " + wanted

          start = None

          for i, line in enumerate(lines):
              if line.rstrip() == target:
                  start = i
                  break

          if start is None:
              raise SystemExit(
                  "ERROR: step missing: " + wanted
              )

          run_index = None

          for i in range(
              start + 1,
              len(lines)
          ):

              line = lines[i]

              if line.startswith(
                  "      - name: "
              ):
                  break

              if line.rstrip() == \
                  "        run: |":
                  run_index = i
                  break

          if run_index is None:
              raise SystemExit(
                  "ERROR: run block missing: "
                  + wanted
              )

          code = []

          for i in range(
              run_index + 1,
              len(lines)
          ):

              line = lines[i]

              if line.startswith(
                  "      - name: "
              ):
                  break

              if line.strip() == "":
                  code.append("")
                  continue

              if line.startswith(
                  "          "
              ):
                  code.append(
                      line[10:]
                  )
                  continue

              indent = \
                  len(line) - len(
                      line.lstrip(" ")
                  )

              if indent < 10:
                  break

              code.append(
                  line[10:]
              )

          if not code:
              raise SystemExit(
                  "ERROR: empty step: "
                  + wanted
              )

          output.write_text(
              "\n".join(code) + "\n",
              encoding="utf-8"
          )

          print(
              "Extracted:",
              wanted
          )
          PY

            chmod +x "$SCRIPT"

            bash "$SCRIPT"

            reload_env

            echo "DONE: $STEP_NAME"
          }

          run_old_step "Download Super Redux-Redux"

          run_old_step "Download Butterscotch iOS"

          run_old_step "Apply GL and VM performance patches"

          run_old_step "Prepare iPhone compiler"

          run_old_step "Set app info"

          run_old_step "Bundle complete Super Redux-Redux"

          run_old_step "Patch Redux rendering"

          run_old_step "Patch Redux gameplay controls"

          run_old_step "Add R LOOK LOCK"

          run_old_step "Add PAUSE FPS and right LOOK"

          run_old_step "Force Modern GL and performance mode"

          run_old_step "Fix iOS math compatibility"

          run_old_step "Add automatic game installer"

          echo
          echo "KNOWN-GOOD BASE COMPLETE"

      # ==========================================================
      # IOS APP SETTINGS
      # ==========================================================

      - name: Set v11.8 app info and 60 FPS mode
        shell: bash
        run: |
          set -euo pipefail

          PLIST="$GITHUB_WORKSPACE/Butterscotch/artifacts/ios/assets/Info.plist"

          test -f "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName Super R-R" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName Super R-R" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleIdentifier com.negelinho.superrr.ios" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CADisableMinimumFrameDurationOnPhone true" \
            "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy \
              -c "Add :CADisableMinimumFrameDurationOnPhone bool true" \
              "$PLIST"

          echo "Info.plist:"
          plutil -p "$PLIST" | head -100

      # ==========================================================
      # FIX THE COMPILE BUG FROM THE OLD RENDER PATCH
      # ==========================================================

      - name: Fix hostFramebuffer compatibility
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$GITHUB_WORKSPACE/Butterscotch/src/ios/main.c"

          test -f "$MAIN"

          python3 - "$MAIN" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])

          lines = p.read_text(
              encoding="utf-8"
          ).splitlines()

          out = []
          removed = 0

          for line in lines:

              if (
                  "->hostFramebuffer" in line
                  and "= framebuffer" in line
              ):

                  out.append(
                      "    /* v11.8: invalid "
                      "hostFramebuffer assignment removed */"
                  )

                  removed += 1

              else:
                  out.append(line)

          p.write_text(
              "\n".join(out) + "\n",
              encoding="utf-8"
          )

          print(
              "hostFramebuffer lines removed:",
              removed
          )
          PY

          if grep -n \
            -- "->hostFramebuffer" \
            "$MAIN"
          then
            echo "ERROR: hostFramebuffer access remains"
            exit 1
          fi

      # ==========================================================
      # PERFORMANCE
      # ==========================================================

      - name: Apply stable iPhone 12 performance tuning
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$GITHUB_WORKSPACE/Butterscotch/src/ios/main.c"

          python3 - "$MAIN" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])

          s = p.read_text(
              encoding="utf-8"
          )

          if "targetScale *= 0.72f;" in s:

              s = s.replace(
                  "targetScale *= 0.72f;",
                  "targetScale *= 0.60f;",
                  1
              )

              print(
                  "Internal framebuffer: 72% -> 60%"
              )

          elif "targetScale *= 0.60f;" in s:

              print(
                  "Internal framebuffer already 60%"
              )

          else:

              print(
                  "No framebuffer scale marker found."
              )

          p.write_text(
              s,
              encoding="utf-8"
          )
          PY

      # ==========================================================
      # SAFE DIRECT START
      #
      # IMPORTANT:
      # We DO NOT replace applicationDidFinishLaunching anymore.
      # We keep the original menu/window/navigation initialization.
      # Only after window is fully initialized do we start Super R-R.
      # ==========================================================

      - name: Add SAFE direct game launch
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$GITHUB_WORKSPACE/Butterscotch/src/ios/main.c"

          test -f "$MAIN"

          python3 - "$MAIN" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])

          s = p.read_text(
              encoding="utf-8"
          )

          marker = \
              "applicationDidFinishLaunching:"

          hit = s.find(marker)

          if hit < 0:
              raise SystemExit(
                  "ERROR: applicationDidFinishLaunching not found"
              )

          start = s.rfind(
              "\n-",
              0,
              hit
          )

          if start < 0:
              start = s.rfind(
                  "-",
                  0,
                  hit
              )
          else:
              start += 1

          open_brace = s.find(
              "{",
              hit
          )

          if open_brace < 0:
              raise SystemExit(
                  "ERROR: launch method opening brace missing"
              )

          depth = 0
          in_string = False
          quote = ""
          escape = False
          end = None

          for i in range(
              open_brace,
              len(s)
          ):

              ch = s[i]

              if in_string:

                  if escape:
                      escape = False

                  elif ch == "\\":
                      escape = True

                  elif ch == quote:
                      in_string = False

                  continue

              if ch in ("'", '"'):
                  in_string = True
                  quote = ch
                  continue

              if ch == "{":
                  depth += 1

              elif ch == "}":
                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise SystemExit(
                  "ERROR: launch method end missing"
              )

          method = s[start:end]

          needle = \
              "    [window makeKeyAndVisible];"

          if method.count(needle) != 1:
              raise SystemExit(
                  "ERROR: makeKeyAndVisible marker count is not 1"
              )

          direct = r'''
              [window makeKeyAndVisible];

              /* v11.8 SAFE DIRECT START:
               * window + gameListVC + navController already exist here.
               * This avoids the v11.7 startup crash caused by replacing
               * the complete applicationDidFinishLaunching method. */

              NSArray *rrRoots =
                  bsGamesRootsToScan();

              if ([rrRoots count] > 0) {

                  NSString *rrGames =
                      [[rrRoots objectAtIndex:0]
                          stringByAppendingPathComponent:@"games"];

                  NSString *rrGameDir =
                      [rrGames
                          stringByAppendingPathComponent:@"Super R-R"];

                  NSString *rrData =
                      [rrGameDir
                          stringByAppendingPathComponent:@"data.win"];

                  if ([[NSFileManager defaultManager]
                          fileExistsAtPath:rrData]) {

                      NSLog(
                          @"Super R-R v11.8: SAFE direct launch."
                      );

                      [self startGameWithPath:rrGameDir];

                  } else {

                      NSLog(
                          @"Super R-R v11.8: data.win missing."
                      );
                  }
              }
          '''

          method = method.replace(
              needle,
              direct,
              1
          )

          s = \
              s[:start] \
              + method \
              + s[end:]

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Safe direct launch inserted."
          )
          PY

          echo "===== SAFE DIRECT CHECK ====="

          grep -n \
            "SAFE direct launch" \
            "$MAIN"

          grep -n \
            "gameListVC =" \
            "$MAIN" \
            | head -5

          grep -n \
            "navController =" \
            "$MAIN" \
            | head -5

      # ==========================================================
      # NEW ICON
      # NO MORE BUTTERSCOTCH CAKE
      # ==========================================================

      - name: Create Hotline Miami Super R-R icon
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install \
            --quiet \
            --disable-pip-version-check \
            pillow

          ASSETS="$GITHUB_WORKSPACE/Butterscotch/artifacts/ios/assets"

          export ASSETS

          python3 <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import os

          assets = Path(
              os.environ["ASSETS"]
          )

          master_size = 1024

          img = Image.new(
              "RGB",
              (master_size, master_size),
              (7, 7, 14)
          )

          draw = ImageDraw.Draw(img)

          font_candidates = [
              Path(
                  "/System/Library/Fonts/"
                  "Supplemental/Arial Bold.ttf"
              ),
              Path(
                  "/System/Library/Fonts/"
                  "Supplemental/Arial Black.ttf"
              ),
          ]

          font_path = None

          for candidate in font_candidates:
              if candidate.exists():
                  font_path = candidate
                  break

          if font_path is None:

              all_fonts = list(
                  Path(
                      "/System/Library/Fonts"
                  ).rglob("*.ttf")
              )

              if all_fonts:
                  font_path = all_fonts[0]

          def font(size):

              if font_path:
                  return ImageFont.truetype(
                      str(font_path),
                      size
                  )

              return ImageFont.load_default()

          # Neon glow-like background strips
          for y in range(
              0,
              master_size,
              32
          ):

              alpha_level = (
                  16 if
                  (y // 32) % 2 == 0
                  else 7
              )

              draw.rectangle(
                  (
                      0,
                      y,
                      master_size,
                      y + 2
                  ),
                  fill=(
                      alpha_level,
                      4,
                      alpha_level + 15
                  )
              )

          lines = [
              (
                  "HOTLINE",
                  190,
                  (255, 45, 88),
                  260
              ),
              (
                  "MIAMI",
                  230,
                  (26, 224, 255),
                  465
              ),
              (
                  "SUPER R-R",
                  130,
                  (88, 255, 136),
                  715
              ),
          ]

          for text, size, color, y in lines:

              f = font(size)

              box = draw.textbbox(
                  (0, 0),
                  text,
                  font=f,
                  stroke_width=4
              )

              w = box[2] - box[0]

              x = (
                  master_size - w
              ) // 2

              # shadow
              draw.text(
                  (
                      x + 12,
                      y + 14
                  ),
                  text,
                  font=f,
                  fill=(30, 0, 30),
                  stroke_width=8,
                  stroke_fill=(0, 0, 0)
              )

              draw.text(
                  (x, y),
                  text,
                  font=f,
                  fill=color,
                  stroke_width=5,
                  stroke_fill=(20, 5, 24)
              )

          master = \
              assets / "SuperRR-MasterIcon.png"

          img.save(
              master,
              "PNG"
          )

          sizes = {
              "Icon.png": 57,
              "Icon@2x.png": 114,

              "Icon-Small.png": 29,
              "Icon-Small@2x.png": 58,
              "Icon-Small@3x.png": 87,

              "Icon-20.png": 20,
              "Icon-20@2x.png": 40,
              "Icon-20@3x.png": 60,

              "Icon-40.png": 40,
              "Icon-40@2x.png": 80,
              "Icon-40@3x.png": 120,

              "Icon-60@2x.png": 120,
              "Icon-60@3x.png": 180,

              "Icon-72.png": 72,
              "Icon-72@2x.png": 144,

              "Icon-76.png": 76,
              "Icon-76@2x.png": 152,

              "Icon-83.5@2x.png": 167,
          }

          for name, size in sizes.items():

              out = img.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              out.save(
                  assets / name,
                  "PNG"
              )

          img.resize(
              (512, 512),
              Image.Resampling.LANCZOS
          ).save(
              assets / "iTunesArtwork",
              "PNG"
          )

          img.resize(
              (1024, 1024),
              Image.Resampling.LANCZOS
          ).save(
              assets / "iTunesArtwork@2x",
              "PNG"
          )

          print(
              "Super R-R icon generated."
          )
          PY

          file "$ASSETS/Icon-60@3x.png"
          file "$ASSETS/iTunesArtwork"

      # ==========================================================
      # A14 COMPILER TUNING
      # ==========================================================

      - name: Detect A14 compiler tuning
        shell: bash
        run: |
          set -euo pipefail

          test -n "${IOS_CC:-}"

          cat \
            > "$RUNNER_TEMP/a14-test.c" \
            <<'EOF'
          int main(void) { return 0; }
          EOF

          CPU_FLAGS=""

          if "$IOS_CC" \
            -c "$RUNNER_TEMP/a14-test.c" \
            -o "$RUNNER_TEMP/a14-test.o" \
            -mcpu=apple-a14 \
            -mtune=apple-a14 \
            >/dev/null 2>&1

          then

            CPU_FLAGS="-mcpu=apple-a14 -mtune=apple-a14"

            echo "Apple A14 optimization enabled."

          else

            echo "Using generic ARM64."

          fi

          echo \
            "CPU_FLAGS=$CPU_FLAGS" \
            >> "$GITHUB_ENV"

      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Clean previous build
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/Butterscotch"

          make distclean || true

          rm -rf build

      - name: Build Super R-R v11.8 IPA
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          cd "$GITHUB_WORKSPACE/Butterscotch"

          HASH="$(git rev-parse --short HEAD)"
          DATE="$(git show -s --format=%cs HEAD)"

          LOG="$GITHUB_WORKSPACE/super-rr-v11.8-build.log"

          make \
            -j4 \
            OS=iOS \
            CC="$IOS_CC" \
            CFLAGS="-O3 -DNDEBUG -flto=thin -fomit-frame-pointer -fno-math-errno -ffp-contract=fast ${CPU_FLAGS:-}" \
            LDFLAGS="-flto=thin -Wl,-dead_strip" \
            DISABLE_WAD14=1 \
            DISABLE_WAD17=1 \
            DISABLE_VM_GML_PROFILER=1 \
            DISABLE_VM_OPCODE_PROFILER=1 \
            DISABLE_VM_STUB_LOGS=1 \
            DISABLE_VM_TRACING=1 \
            BUTTERSCOTCH_COMMIT_HASH="$HASH" \
            BUTTERSCOTCH_COMMIT_DATE="$DATE" \
            2>&1 | tee "$LOG"

      # ==========================================================
      # VERIFY
      # ==========================================================

      - name: Verify v11.8 IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA="$GITHUB_WORKSPACE/Butterscotch/build/butterscotch.ipa"

          BIN="$GITHUB_WORKSPACE/Butterscotch/build/butterscotch"

          test -f "$IPA"
          test -f "$BIN"

          echo "Binary:"
          file "$BIN"

          echo
          echo "Architecture:"
          lipo -info "$BIN" || true

          echo
          echo "IPA:"
          ls -lh "$IPA"

          echo
          echo "Game data:"
          unzip -l "$IPA" \
            | grep \
              "BundledGame/data.win"

          echo
          echo "New icon:"
          unzip -l "$IPA" \
            | grep \
              "Icon-60@3x.png"

      # ==========================================================
      # OUTPUT
      # ==========================================================

      - name: Prepare Super R-R v11.8
        shell: bash
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/output"

          rm -rf "$OUT"

          mkdir -p "$OUT"

          cp \
            "$GITHUB_WORKSPACE/Butterscotch/build/butterscotch.ipa" \
            "$OUT/Super-R-R-iOS-v11.8-CRASH-FIX-DIRECT.ipa"

          cat \
            > "$OUT/README.txt" \
            <<'EOF'
          SUPER R-R iOS v11.8
          ==================

          CRASH FIX BUILD

          - Butterscotch iOS base pinned to the known-good
            revision used by successful v11.5.

          - Original applicationDidFinishLaunching is preserved.

          - Direct game start happens only AFTER normal UIKit,
            navigation controller and window initialization.

          - Super R-R is automatically installed from BundledGame.

          - New HOTLINE MIAMI SUPER R-R icon.

          - No Butterscotch cake icon.

          - ARM64 / iPhone 12 tuning.

          - 60 FPS target.

          - Existing touch controls preserved.

          IPA is unsigned.
          EOF

          ls -lh "$OUT"

      - name: Upload Super R-R v11.8 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Super-R-R-iOS-v11.8-CRASH-FIX-IPA
          path: |
            output/Super-R-R-iOS-v11.8-CRASH-FIX-DIRECT.ipa
            output/README.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Super-R-R-v11.8-FAILED
          path: |
            super-rr-v11.8-build.log
            Butterscotch/src/ios/main.c
            Butterscotch/src/vm_builtins.c
            Butterscotch/src/loop.c
            Butterscotch/artifacts/ios/assets/Info.plist
          if-no-files-found: ignore
          retention-days: 7
