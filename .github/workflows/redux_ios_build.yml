name: Super Redux-Redux iOS FINAL MAX FPS v10 FIXED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Final MAX FPS
    runs-on: macos-14
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # CHECK OLD v9 WORKFLOW
      # ==========================================================

      - name: Check existing Super RR workflow
        shell: bash
        run: |
          set -e

          BASE="$GITHUB_WORKSPACE/.github/workflows/redux_ios_build.yml"

          if [ ! -f "$BASE" ]; then
            echo "ERROR: redux_ios_build.yml not found"
            echo "Keep the old v9 workflow in the repository."
            exit 1
          fi

          grep -n "Download Super Redux-Redux" "$BASE"
          grep -n "Patch Redux gameplay controls" "$BASE"
          grep -n "Add R LOOK LOCK" "$BASE"
          grep -n "Add PAUSE FPS and right LOOK" "$BASE"
          grep -n "Force Modern GL and performance mode" "$BASE"

          echo
          echo "Base workflow ready."

      # ==========================================================
      # REUSE ALL WORKING v9 PATCHES
      #
      # IMPORTANT FIX:
      #
      # python3 -
      #
      # means Python reads the helper program from stdin.
      # The old YAML is NOT executed as Python anymore.
      # ==========================================================

      - name: Apply known-good Super RR patches
        shell: bash
        run: |
          set -euo pipefail

          BASE="$GITHUB_WORKSPACE/.github/workflows/redux_ios_build.yml"

          run_old_step() {

            STEP_NAME="$1"

            TMP_SCRIPT="$RUNNER_TEMP/superrr-step.sh"

            echo
            echo "========================================"
            echo "RUNNING: $STEP_NAME"
            echo "========================================"

            python3 - "$BASE" "$STEP_NAME" "$TMP_SCRIPT" <<'PY'
          from pathlib import Path
          import sys

          workflow_path = Path(
              sys.argv[1]
          )

          wanted_name = sys.argv[2]

          output_path = Path(
              sys.argv[3]
          )

          lines = (
              workflow_path
              .read_text()
              .splitlines()
          )

          step_line = (
              "      - name: " +
              wanted_name
          )

          start_index = None

          for i, line in enumerate(lines):

              if line.rstrip() == step_line:

                  start_index = i
                  break

          if start_index is None:

              raise SystemExit(
                  "ERROR: step not found: " +
                  wanted_name
              )

          run_index = None

          for i in range(
              start_index + 1,
              len(lines)
          ):

              line = lines[i]

              if line.startswith(
                  "      - name: "
              ):
                  break

              if line.rstrip() == (
                  "        run: |"
              ):

                  run_index = i
                  break

          if run_index is None:

              raise SystemExit(
                  "ERROR: run block missing: " +
                  wanted_name
              )

          code = []

          for i in range(
              run_index + 1,
              len(lines)
          ):

              line = lines[i]

              if line.startswith(
                  "      - name: "
              ):
                  break

              if line.strip() == "":

                  code.append("")
                  continue

              if line.startswith(
                  "          "
              ):

                  code.append(
                      line[10:]
                  )

                  continue

              indent = (
                  len(line) -
                  len(
                      line.lstrip(" ")
                  )
              )

              if indent < 10:
                  break

              code.append(
                  line[10:]
              )

          if not code:

              raise SystemExit(
                  "ERROR: empty run block: " +
                  wanted_name
              )

          output_path.write_text(
              "\n".join(code) +
              "\n"
          )

          print(
              "Extracted:",
              wanted_name
          )
          PY

            chmod +x \
              "$TMP_SCRIPT"

            bash \
              "$TMP_SCRIPT"

            # ----------------------------------------------
            # Old Actions steps can write variables such as
            # GAME_DIR and IOS_CC into GITHUB_ENV.
            #
            # Because we execute several old steps inside
            # this one step, reload simple KEY=value lines.
            # ----------------------------------------------

            if [ -f "$GITHUB_ENV" ]; then

              while IFS= read -r ENV_LINE; do

                case "$ENV_LINE" in

                  *=*)
                    export "$ENV_LINE"
                    ;;

                esac

              done < "$GITHUB_ENV"

            fi

            echo
            echo "DONE: $STEP_NAME"
          }

          # ======================================================
          # SAME PATCHES / CONTROLS FROM v9
          # ======================================================

          run_old_step \
            "Download Super Redux-Redux"

          run_old_step \
            "Download Butterscotch iOS"

          run_old_step \
            "Apply GL and VM performance patches"

          run_old_step \
            "Prepare iPhone compiler"

          run_old_step \
            "Set app info"

          run_old_step \
            "Bundle complete Super Redux-Redux"

          run_old_step \
            "Patch Redux rendering"

          run_old_step \
            "Patch Redux gameplay controls"

          run_old_step \
            "Add R LOOK LOCK"

          run_old_step \
            "Add PAUSE FPS and right LOOK"

          run_old_step \
            "Force Modern GL and performance mode"

          # ======================================================
          # KEEP MATH FIX + AUTOMATIC GAME INSTALLER
          # ======================================================

          run_old_step \
            "Fix iOS math compatibility"

          run_old_step \
            "Add automatic game installer"

          # ======================================================
          # WE INTENTIONALLY DO NOT RUN:
          #
          # Add GML profiler switch
          # Save profiler results to Files app
          #
          # Final build has profiler completely compiled out.
          # ======================================================

          echo
          echo "========================================"
          echo "ALL BASE PATCHES APPLIED"
          echo "========================================"

      # ==========================================================
      # FINAL PERFORMANCE CHANGES
      # ==========================================================

      - name: Apply FINAL MAX FPS tuning
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          python3 <<'PY'
          from pathlib import Path
          import re

          main = Path(
              "Butterscotch/src/ios/main.c"
          )

          if not main.exists():

              raise SystemExit(
                  "ERROR: main.c missing"
              )

          s = main.read_text()

          # ======================================================
          # 1. REMOVE UNUSED PHYSICAL CONTROLLER POLLING
          #
          # Touch controls stay.
          # ======================================================

          controller_pattern = re.compile(
              r'(bool\s+platformHandleEvents'
              r'\s*\(\s*void\s*\)\s*\{\s*)'
              r'bsPollGameControllers'
              r'\s*\(\s*\)\s*;\s*',
              re.MULTILINE
          )

          s2, count = (
              controller_pattern.subn(
                  r'\1',
                  s,
                  count=1
              )
          )

          if count == 1:

              s = s2

              print(
                  "Controller polling removed."
              )

          else:

              print(
                  "Controller polling already absent."
              )

          # ======================================================
          # 2. FINAL INTERNAL RESOLUTION
          #
          # v9 used 72%.
          #
          # v10 uses 60%.
          #
          # This renders about 36% as many pixels as native.
          # ======================================================

          if (
              "targetScale *= 0.72f;"
              in s
          ):

              s = s.replace(
                  "targetScale *= 0.72f;",
                  "targetScale *= 0.60f;",
                  1
              )

              print(
                  "Framebuffer scale changed 72% -> 60%."
              )

          elif (
              "targetScale *= 0.60f;"
              in s
          ):

              print(
                  "Framebuffer already at 60%."
              )

          else:

              raise SystemExit(
                  "ERROR: existing render scale patch missing"
              )

          # ======================================================
          # 3. FORCE HIGH-RES OPTION OFF
          # ======================================================

          highres_pattern = re.compile(
              r'static\s+bool\s+'
              r'bsLoadHighResEnabled'
              r'\s*\(\s*void\s*\)'
              r'\s*\{.*?\n\}',
              re.DOTALL
          )

          highres_replacement = '''static bool bsLoadHighResEnabled(void) {
              return false;
          }'''

          s2, count = (
              highres_pattern.subn(
                  highres_replacement,
                  s,
                  count=1
              )
          )

          if count == 1:

              s = s2

              print(
                  "High-resolution mode forced OFF."
              )

          else:

              print(
                  "High-resolution function not changed."
              )

          main.write_text(
              s
          )

          print("")
          print(
              "======================================"
          )
          print(
              "FINAL MAX FPS TUNING APPLIED"
          )
          print(
              "======================================"
          )
          PY

      # ==========================================================
      # VERIFY
      # ==========================================================

      - name: Verify FINAL patches
        shell: bash
        run: |
          set -e

          MAIN="$GITHUB_WORKSPACE/Butterscotch/src/ios/main.c"

          echo
          echo "======================================"
          echo "FINAL SOURCE CHECK"
          echo "======================================"

          echo
          echo "Modern GL:"

          grep -n \
            "return BS_RENDERER_MODERN_GL" \
            "$MAIN"

          echo
          echo "60% framebuffer:"

          grep -n \
            "targetScale \*= 0.60f" \
            "$MAIN"

          echo
          echo "R:"

          grep -n \
            "key:'R'" \
            "$MAIN"

          echo
          echo "LOOK:"

          grep -n \
            'label:@"LOOK"' \
            "$MAIN"

          echo
          echo "LOCK:"

          grep -n \
            'label:@"LOCK"' \
            "$MAIN"

          echo
          echo "PAUSE:"

          grep -n \
            'label:@"II"' \
            "$MAIN"

          echo
          echo "FPS counter:"

          grep -n \
            "bsDisplayedFPS" \
            "$MAIN" \
            | head

          echo
          echo "RIGHT LOOK:"

          grep -n \
            "BSLookPad" \
            "$MAIN" \
            | head

          echo
          echo "Bundled installer:"

          grep -n \
            "Super R-R installed" \
            "$MAIN"

          echo
          echo "======================================"
          echo "ALL FINAL PATCHES PRESENT"
          echo "======================================"

      # ==========================================================
      # A14 OPTIMIZATION
      #
      # Use it only if the installed clang supports it.
      # Otherwise safely stay generic ARM64.
      # ==========================================================

      - name: Detect Apple A14 compiler tuning
        shell: bash
        run: |
          set -e

          cat > \
            "$RUNNER_TEMP/a14-test.c" \
            <<'EOF'
          int main(void) {
              return 0;
          }
          EOF

          CPU_FLAGS=""

          if "$IOS_CC" \
              -c \
              "$RUNNER_TEMP/a14-test.c" \
              -o "$RUNNER_TEMP/a14-test.o" \
              -mcpu=apple-a14 \
              -mtune=apple-a14 \
              >/dev/null 2>&1; then

            CPU_FLAGS="-mcpu=apple-a14 -mtune=apple-a14"

            echo
            echo "Apple A14 tuning supported."

          else

            echo
            echo "Apple A14 tuning unavailable."
            echo "Using generic ARM64 safely."

          fi

          echo "CPU_FLAGS=$CPU_FLAGS" \
            >> "$GITHUB_ENV"

      # ==========================================================
      # CLEAN
      # ==========================================================

      - name: Clean previous build
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/Butterscotch"

          make distclean || true

      # ==========================================================
      # FINAL RELEASE BUILD
      #
      # NO DIAGNOSTIC PROFILER.
      # NO PROFILER FILE.
      #
      # We want minimum runtime overhead now.
      # ==========================================================

      - name: Build FINAL MAX FPS
        shell: bash
        run: |
          set +e

          cd "$GITHUB_WORKSPACE/Butterscotch"

          HASH="$(
            git rev-parse \
              --short HEAD
          )"

          DATE="$(
            git show \
              -s \
              --format=%cs \
              HEAD
          )"

          echo
          echo "======================================"
          echo "SUPER REDUX-REDUX FINAL MAX FPS v10"
          echo "======================================"
          echo
          echo "ARM64"
          echo "CPU flags: $CPU_FLAGS"
          echo
          echo "Modern GL forced"
          echo "60% framebuffer"
          echo "High resolution OFF"
          echo "Controller polling OFF"
          echo
          echo "GML profiler COMPILED OUT"
          echo "Opcode profiler COMPILED OUT"
          echo "Tracing COMPILED OUT"
          echo "Stub logs COMPILED OUT"
          echo
          echo "O3"
          echo "Thin LTO"
          echo "Frame pointer OFF"
          echo "Math errno OFF"
          echo "FP contraction FAST"
          echo
          echo "======================================"

          make \
            -j4 \
            OS=iOS \
            CC="$IOS_CC" \
            CFLAGS="-O3 -DNDEBUG -flto=thin -fomit-frame-pointer -fno-math-errno -ffp-contract=fast $CPU_FLAGS" \
            LDFLAGS="-flto=thin -Wl,-dead_strip" \
            DISABLE_WAD14=1 \
            DISABLE_WAD17=1 \
            DISABLE_VM_GML_PROFILER=1 \
            DISABLE_VM_OPCODE_PROFILER=1 \
            DISABLE_VM_STUB_LOGS=1 \
            DISABLE_VM_TRACING=1 \
            BUTTERSCOTCH_COMMIT_HASH="$HASH" \
            BUTTERSCOTCH_COMMIT_DATE="$DATE" \
            2>&1 \
            | tee \
              "$GITHUB_WORKSPACE/final-max-fps.log"

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then

            echo
            echo "======================================"
            echo "REAL BUILD ERRORS"
            echo "======================================"

            grep \
              -n \
              -E \
              "error:|fatal error:|ERROR:" \
              "$GITHUB_WORKSPACE/final-max-fps.log" \
              | tail \
                  -200 \
              || true

            echo "======================================"

            exit "$STATUS"
          fi

          echo
          echo "======================================"
          echo "BUILD FINISHED"
          echo "======================================"

          find build \
            -maxdepth 2 \
            -type f \
            -print

      # ==========================================================
      # VERIFY IPA
      # ==========================================================

      - name: Verify FINAL IPA
        shell: bash
        run: |
          set -e

          IPA="$GITHUB_WORKSPACE/Butterscotch/build/butterscotch.ipa"

          BIN="$GITHUB_WORKSPACE/Butterscotch/build/butterscotch"

          test -f "$IPA"
          test -f "$BIN"

          echo
          echo "Binary:"

          file "$BIN"

          echo
          echo "Architecture:"

          lipo \
            -info \
            "$BIN" \
            || true

          echo
          echo "IPA:"

          ls \
            -lh \
            "$IPA"

          echo
          echo "Bundled data.win:"

          unzip \
            -l \
            "$IPA" \
            | grep \
                -i \
                "BundledGame/data.win"

      # ==========================================================
      # PREPARE OUTPUT
      # ==========================================================

      - name: Prepare FINAL IPA
        shell: bash
        run: |
          set -e

          mkdir -p \
            "$GITHUB_WORKSPACE/output"

          cp \
            "$GITHUB_WORKSPACE/Butterscotch/build/butterscotch.ipa" \
            "$GITHUB_WORKSPACE/output/Super-Redux-Redux-iOS-FINAL-MAX-FPS-v10.ipa"

          cat > \
            "$GITHUB_WORKSPACE/output/README.txt" \
            <<'EOF'
          SUPER REDUX-REDUX iOS
          FINAL MAX FPS v10
          ===================

          PERFORMANCE
          -----------

          Modern GL forced

          ARM64

          Apple A14 tuning
          when compiler supports it

          O3

          Thin LTO

          60 percent internal framebuffer

          High-resolution mode OFF

          Physical controller polling OFF

          GML profiler compiled out

          Opcode profiler compiled out

          VM tracing compiled out

          Stub logging compiled out


          CONTROLS
          --------

          LEFT STICK

          movement


          RIGHT LOOK

          look / aim


          TOUCH GAME AREA

          direct aim


          A

          shoot / punch / Enter


          X

          pickup / throw


          C

          interaction


          R

          restart


          LOOK

          Shift


          LOCK

          middle mouse


          II

          pause


          FPS

          real FPS counter


          TEST
          ----

          1. Mask selection

          2. Normal level

          3. Fight with several enemies


          IPA is unsigned/ad-hoc.
          EOF

          echo
          echo "======================================"
          echo "OUTPUT"
          echo "======================================"

          ls \
            -lh \
            "$GITHUB_WORKSPACE/output"

      # ==========================================================
      # UPLOAD
      # ==========================================================

      - name: Upload FINAL MAX FPS IPA
        uses: actions/upload-artifact@v4
        with:
          name: super-redux-redux-ios-FINAL-MAX-FPS-v10
          path: |
            output/Super-Redux-Redux-iOS-FINAL-MAX-FPS-v10.ipa
            output/README.txt
          if-no-files-found: error
          retention-days: 7

      # ==========================================================
      # DEBUG
      # ==========================================================

      - name: Upload debug files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: super-rr-final-max-fps-failed
          path: |
            Butterscotch/src/ios/main.c
            Butterscotch/src/vm_builtins.c
            Butterscotch/src/loop.c
            Butterscotch/src/math_compat.h
            Butterscotch/compat/config.mk
            final-max-fps.log
          if-no-files-found: ignore
          retention-days: 7
