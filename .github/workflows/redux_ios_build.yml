          impl = r'''
          @implementation BSLookPad

          @synthesize frame = _frame;


          - (id)initWithFrame:
              (CGRect)frame {

              if ((self =
                  [super init])) {

                  _frame =
                      frame;

                  _touch =
                      nil;

                  _thumbOffset =
                      CGPointZero;
              }

              return self;
          }


          - (void)updateAimFromPoint:
              (CGPoint)point {

              CGPoint offset =
                  joystickClampOffset(
                      _frame,
                      point
                  );

              _thumbOffset =
                  offset;

              CGFloat maxR =
                  joystickRadius(
                      _frame
                  );

              if (maxR <=
                  1.0f)
                  return;

              CGFloat nx =
                  offset.x /
                  maxR;

              CGFloat ny =
                  offset.y /
                  maxR;

              const CGFloat deadzone =
                  0.12f;

              if (fabs(nx) <
                  deadzone)
                  nx = 0.0f;

              if (fabs(ny) <
                  deadzone)
                  ny = 0.0f;

              CGRect screen =
                  [[UIScreen mainScreen]
                      bounds];

              double cx =
                  screen.size.width *
                  0.5;

              double cy =
                  screen.size.height *
                  0.5;

              double radiusX =
                  screen.size.width *
                  0.42;

              double radiusY =
                  screen.size.height *
                  0.42;

              double mx =
                  cx +
                  ((double)nx *
                   radiusX);

              double my =
                  cy +
                  ((double)ny *
                   radiusY);

              if (mx < 0.0)
                  mx = 0.0;

              if (my < 0.0)
                  my = 0.0;

              if (mx >
                  screen.size.width)
                  mx =
                      screen.size.width;

              if (my >
                  screen.size.height)
                  my =
                      screen.size.height;

              atomic_store(
                  &bsTouchMouseX,
                  mx
              );

              atomic_store(
                  &bsTouchMouseY,
                  my
              );
          }


          - (BOOL)handleTouchBegan:
              (UITouch *)touch
              point:
              (CGPoint)point {

              if (_touch)
                  return NO;

              if (!CGRectContainsPoint(
                      CGRectInset(
                          _frame,
                          -12.0f,
                          -12.0f
                      ),
                      point
                  ))
                  return NO;

              _touch =
                  [touch retain];

              [self
                  updateAimFromPoint:
                      point];

              return YES;
          }


          - (BOOL)handleTouchMoved:
              (UITouch *)touch
              point:
              (CGPoint)point {

              if (touch !=
                  _touch)
                  return NO;

              [self
                  updateAimFromPoint:
                      point];

              return YES;
          }


          - (BOOL)handleTouchEnded:
              (UITouch *)touch {

              if (touch !=
                  _touch)
                  return NO;

              _thumbOffset =
                  CGPointZero;

              [_touch
                  release];

              _touch =
                  nil;

              return YES;
          }


          - (void)drawInContext:
              (CGContextRef)ctx {

              CGFloat cx =
                  _frame.origin.x +
                  _frame.size.width *
                  0.5f;

              CGFloat cy =
                  _frame.origin.y +
                  _frame.size.height *
                  0.5f;

              CGFloat baseR =
                  joystickRadius(
                      _frame
                  );

              CGRect baseRect =
                  CGRectMake(
                      cx - baseR,
                      cy - baseR,
                      baseR * 2.0f,
                      baseR * 2.0f
                  );

              CGContextSetRGBFillColor(
                  ctx,
                  1.0f,
                  1.0f,
                  1.0f,
                  _touch
                      ? 0.42f
                      : 0.20f
              );

              CGContextFillEllipseInRect(
                  ctx,
                  baseRect
              );

              CGFloat thumbR =
                  baseR *
                  0.34f;

              CGFloat thumbX =
                  cx +
                  _thumbOffset.x;

              CGFloat thumbY =
                  cy +
                  _thumbOffset.y;

              CGRect thumbRect =
                  CGRectMake(
                      thumbX -
                          thumbR,
                      thumbY -
                          thumbR,
                      thumbR * 2.0f,
                      thumbR * 2.0f
                  );

              CGContextSetRGBFillColor(
                  ctx,
                  1.0f,
                  1.0f,
                  1.0f,
                  0.50f
              );

              CGContextFillEllipseInRect(
                  ctx,
                  thumbRect
              );
          }


          - (void)dealloc {

              if (_touch)
                  [_touch
                      release];

              [super dealloc];
          }

          @end


          '''

          if marker not in s:
              raise SystemExit(
                  "ERROR: BSDpad implementation missing"
              )

          s = s.replace(
              marker,
              impl +
              marker,
              1
          )

          p.write_text(s)

          print(
              "PAUSE FPS RIGHT LOOK complete."
          )
          PY

      # ==========================================================
      # MODERN GL + PERFORMANCE
      # ==========================================================

      - name: Force Modern GL and performance mode
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "Butterscotch/src/ios/main.c"
          )

          s = p.read_text()

          pattern = re.compile(
              r'static int bsLoadRendererPreference\(void\)\s*\{.*?\n\}',
              re.S
          )

          replacement = '''static int bsLoadRendererPreference(void) {
              return BS_RENDERER_MODERN_GL;
          }'''

          s, count = pattern.subn(
              replacement,
              s,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: renderer preference missing"
              )

          old = '''    targetScale += 0.0005f;
              if (targetScale > nativeScale) targetScale = nativeScale;'''

          new = '''    targetScale *= 0.72f;

              if (targetScale < 0.35f)
                  targetScale = 0.35f;

              targetScale += 0.0005f;

              if (targetScale > nativeScale)
                  targetScale = nativeScale;'''

          if old not in s:
              raise SystemExit(
                  "ERROR: render scale marker missing"
              )

          s = s.replace(
              old,
              new,
              1
          )

          old_thread = '''- (void)gameThread {
              NSAutoreleasePool *pool = [[NSAutoreleasePool alloc] init];'''

          new_thread = '''- (void)gameThread {
              NSAutoreleasePool *pool = [[NSAutoreleasePool alloc] init];

              if ([[NSThread currentThread]
                      respondsToSelector:
                          @selector(
                              setQualityOfService:
                          )]) {

                  [[NSThread currentThread]
                      setQualityOfService:
                          NSQualityOfServiceUserInteractive];
              }'''

          if old_thread in s:

              s = s.replace(
                  old_thread,
                  new_thread,
                  1
              )

          p.write_text(s)

          print("")
          print(
              "======================================"
          )
          print(
              "MODERN GL FORCED"
          )
          print(
              "FRAMEBUFFER 72%"
          )
          print(
              "======================================"
          )
          PY

