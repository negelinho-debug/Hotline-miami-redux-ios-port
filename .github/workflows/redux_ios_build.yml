name: Super R-R iOS v11.5 - HOSTFRAMEBUFFER FIX

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ios:
    name: Build Super R-R IPA
    runs-on: macos-14
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover last known-good Super R-R workflow
        shell: bash
        run: |
          set -euo pipefail

          TARGET=".github/workflows/redux_ios_build.yml"
          OUT="$RUNNER_TEMP/redux_known_good.yml"

          rm -f "$OUT"

          echo "Searching git history for the last workflow that still contains the real build steps..."

          for COMMIT in $(git log --format='%H' --all -- "$TARGET"); do
            CANDIDATE="$RUNNER_TEMP/redux_candidate.yml"

            if ! git show "$COMMIT:$TARGET" > "$CANDIDATE" 2>/dev/null; then
              continue
            fi

            # IMPORTANT: inspect REAL YAML step names only.
            # v11 mentioned the old names inside strings, so grep falsely
            # selected v11 itself. This parser prevents that.
            if python3 - "$CANDIDATE" <<'PY'
          from pathlib import Path
          import re, sys

          p = Path(sys.argv[1])
          names = []
          for line in p.read_text(encoding="utf-8").splitlines():
              m = re.match(r'^      - name:\s*(.+?)\s*$', line)
              if m:
                  names.append(m.group(1).strip('"\''))

          required = {
              "Download Super Redux-Redux",
              "Download Butterscotch iOS",
              "Apply GL and VM performance patches",
              "Prepare iPhone compiler",
              "Set app info",
              "Bundle complete Super Redux-Redux",
              "Patch Redux rendering",
              "Patch Redux gameplay controls",
              "Add R LOOK LOCK",
              "Add PAUSE FPS and right LOOK",
              "Force Modern GL and performance mode",
              "Fix iOS math compatibility",
              "Add automatic game installer",
          }

          missing = sorted(required - set(names))
          if missing:
              print("Skipping candidate; missing real steps:", ", ".join(missing))
              raise SystemExit(1)

          print("REAL recovered steps found:")
          for n in names:
              if n in required:
                  print("  -", n)
          PY
            then
              cp "$CANDIDATE" "$OUT"
              echo "Recovered REAL known-good base from commit: $COMMIT"
              break
            fi
          done

          if [ ! -s "$OUT" ]; then
            echo "ERROR: Could not recover the old working Super R-R workflow from git history."
            git log --oneline --all -- "$TARGET" | head -30
            exit 1
          fi

          echo "BASE_WORKFLOW=$OUT" >> "$GITHUB_ENV"

          echo "===== RECOVERED STEPS ====="
          grep -n '^      - name:' "$OUT" | head -80

      - name: Apply all known-good Super R-R base patches
        shell: bash
        run: |
          set -euo pipefail

          BASE="$BASE_WORKFLOW"

          reload_env() {
            if [ -f "$GITHUB_ENV" ]; then
              while IFS= read -r LINE; do
                case "$LINE" in
                  *=*)
                    KEY="${LINE%%=*}"
                    case "$KEY" in
                      *[!A-Za-z0-9_]*|'') ;;
                      *) export "$LINE" ;;
                    esac
                    ;;
                esac
              done < "$GITHUB_ENV"
            fi
          }

          run_old_step() {
            STEP_NAME="$1"
            TMP_SCRIPT="$RUNNER_TEMP/superrr-old-step.sh"

            echo
            echo "=================================================="
            echo "RUNNING RECOVERED STEP: $STEP_NAME"
            echo "=================================================="

            python3 - "$BASE" "$STEP_NAME" "$TMP_SCRIPT" <<'PY'
          from pathlib import Path
          import sys

          workflow = Path(sys.argv[1])
          wanted = sys.argv[2]
          output = Path(sys.argv[3])

          lines = workflow.read_text(encoding="utf-8").splitlines()
          target = "      - name: " + wanted

          start = None
          for i, line in enumerate(lines):
              if line.rstrip() == target:
                  start = i
                  break

          if start is None:
              raise SystemExit("ERROR: recovered step not found: " + wanted)

          run_index = None
          for i in range(start + 1, len(lines)):
              line = lines[i]
              if line.startswith("      - name: "):
                  break
              if line.rstrip() == "        run: |":
                  run_index = i
                  break

          if run_index is None:
              raise SystemExit("ERROR: run block missing for: " + wanted)

          code = []
          for i in range(run_index + 1, len(lines)):
              line = lines[i]

              if line.startswith("      - name: "):
                  break

              if line.strip() == "":
                  code.append("")
                  continue

              if line.startswith("          "):
                  code.append(line[10:])
                  continue

              indent = len(line) - len(line.lstrip(" "))
              if indent < 10:
                  break

              code.append(line[10:])

          if not code:
              raise SystemExit("ERROR: empty recovered run block: " + wanted)

          output.write_text(chr(10).join(code) + chr(10), encoding="utf-8")
          print("Extracted recovered step:", wanted)
          PY

            chmod +x "$TMP_SCRIPT"
            bash "$TMP_SCRIPT"
            reload_env

            echo "DONE: $STEP_NAME"
          }

          run_old_step "Download Super Redux-Redux"
          run_old_step "Download Butterscotch iOS"
          run_old_step "Apply GL and VM performance patches"
          run_old_step "Prepare iPhone compiler"
          run_old_step "Set app info"
          run_old_step "Bundle complete Super Redux-Redux"
          run_old_step "Patch Redux rendering"
          run_old_step "Patch Redux gameplay controls"
          run_old_step "Add R LOOK LOCK"
          run_old_step "Add PAUSE FPS and right LOOK"
          run_old_step "Force Modern GL and performance mode"
          run_old_step "Fix iOS math compatibility"
          run_old_step "Add automatic game installer"

          echo
          echo "=================================================="
          echo "KNOWN-GOOD BASE RESTORED"
          echo "=================================================="

      - name: Force Super R-R app identity and 60 FPS iOS mode
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/Butterscotch"

          PLIST="$(find . -type f -name 'Info.plist' | grep -E '/ios/|artifacts/ios|build' | head -1 || true)"

          if [ -z "$PLIST" ]; then
            PLIST="$(find . -type f -name 'Info.plist' | head -1 || true)"
          fi

          if [ -n "$PLIST" ] && [ -f "$PLIST" ]; then
            echo "Patching: $PLIST"

            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Super R-R" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Super R-R" "$PLIST"

            /usr/libexec/PlistBuddy -c "Set :CFBundleName Super R-R" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleName string Super R-R" "$PLIST"

            /usr/libexec/PlistBuddy -c "Set :CADisableMinimumFrameDurationOnPhone true" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CADisableMinimumFrameDurationOnPhone bool true" "$PLIST"

            plutil -p "$PLIST" | head -120
          else
            echo "Info.plist not found yet; continuing because the iOS Makefile may generate it later."
          fi

      - name: Fix iOS renderer compatibility - remove invalid hostFramebuffer access
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$GITHUB_WORKSPACE/Butterscotch/src/ios/main.c"
          test -f "$MAIN"

          echo "===== FIX hostFramebuffer COMPILE ERROR ====="
          echo "Before:"
          grep -n "hostFramebuffer" "$MAIN" || true

          python3 - "$MAIN" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          lines = p.read_text(encoding="utf-8").splitlines()

          kept = []
          removed = []

          for line in lines:
              # The recovered rendering patch wrote to a field that does not
              # exist in the current GRenderer struct:
              # ((GRenderer *)g_runner->renderer)->hostFramebuffer = framebuffer;
              if "->hostFramebuffer" in line and "= framebuffer" in line:
                  removed.append(line)
                  kept.append("    /* iOS v11.5: invalid hostFramebuffer assignment removed; current GRenderer has no such member. */")
              else:
                  kept.append(line)

          if not removed:
              print("No hostFramebuffer assignment found; nothing to remove.")
          else:
              print("Removed invalid line(s):")
              for line in removed:
                  print(line)

          p.write_text("\n".join(kept) + "\n", encoding="utf-8")
          PY

          echo "After:"
          if grep -n "->hostFramebuffer" "$MAIN"; then
            echo "ERROR: invalid hostFramebuffer access still exists."
            exit 1
          fi

          echo "hostFramebuffer compatibility fix applied."

      - name: Backup known-good iOS source before extra tuning
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/Butterscotch/src/ios/main.c"              "$RUNNER_TEMP/superrr-main-known-good.c"
          echo "Backed up main.c before extra v11 tuning."

      - name: Apply FINAL 60 FPS performance tuning
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          python3 <<'PY'
          from pathlib import Path

          main = Path("Butterscotch/src/ios/main.c")

          if not main.exists():
              raise SystemExit("ERROR: Butterscotch/src/ios/main.c missing")

          s = main.read_text(encoding="utf-8")

          # SAFE ONLY: no regex replacing whole C/Obj-C function bodies.
          if "targetScale *= 0.72f;" in s:
              s = s.replace("targetScale *= 0.72f;", "targetScale *= 0.60f;", 1)
              print("Framebuffer: 72% -> 60%.")
          elif "targetScale *= 0.60f;" in s:
              print("Framebuffer already 60%.")
          else:
              print("Framebuffer marker not found; leaving source unchanged.")

          main.write_text(s, encoding="utf-8")
          PY

      - name: Inspect controls and FPS patches
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$GITHUB_WORKSPACE/Butterscotch/src/ios/main.c"

          test -f "$MAIN"

          echo "===== CONTROL PATCH INSPECTION ====="
          echo "These checks are informational only because older known-good patches use different source formatting."

          for PATTERN in             "key:'R'"             'label:@"LOOK"'             'label:@"LOCK"'             'label:@"II"'             "bsDisplayedFPS"             "BSLookPad"             "Super R-R installed"
          do
            echo
            echo ">>> $PATTERN"
            grep -nF "$PATTERN" "$MAIN" | head -5 || true
          done

          echo
          echo "===== BROADER CONTROL SEARCH ====="
          grep -niE 'LOOK|LOCK|pause|fps|restart|touch|joystick|gamepad' "$MAIN"             | head -120 || true

          echo
          echo "Verification will NOT block the IPA build."

      - name: Detect A14 compiler tuning
        shell: bash
        run: |
          set -euo pipefail

          test -n "${IOS_CC:-}"

          cat > "$RUNNER_TEMP/a14-test.c" <<'EOF'
          int main(void) { return 0; }
          EOF

          CPU_FLAGS=""

          if "$IOS_CC" \
            -c "$RUNNER_TEMP/a14-test.c" \
            -o "$RUNNER_TEMP/a14-test.o" \
            -mcpu=apple-a14 \
            -mtune=apple-a14 \
            >/dev/null 2>&1
          then
            CPU_FLAGS="-mcpu=apple-a14 -mtune=apple-a14"
            echo "Apple A14 optimization enabled."
          else
            echo "Using generic ARM64."
          fi

          echo "CPU_FLAGS=$CPU_FLAGS" >> "$GITHUB_ENV"

      - name: Clean previous build
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/Butterscotch"
          make distclean || true
          rm -rf build

      - name: Build Super R-R iOS IPA with automatic fallback
        shell: bash
        run: |
          set +e
          set -o pipefail

          cd "$GITHUB_WORKSPACE/Butterscotch"

          HASH="$(git rev-parse --short HEAD)"
          DATE="$(git show -s --format=%cs HEAD)"
          LOG1="$GITHUB_WORKSPACE/super-rr-v11.5-build-primary.log"
          LOG2="$GITHUB_WORKSPACE/super-rr-v11.5-build-fallback.log"

          build_once() {
            LOG="$1"
            make               -j4               OS=iOS               CC="$IOS_CC"               CFLAGS="-O3 -DNDEBUG -flto=thin -fomit-frame-pointer -fno-math-errno -ffp-contract=fast ${CPU_FLAGS:-}"               LDFLAGS="-flto=thin -Wl,-dead_strip"               DISABLE_WAD14=1               DISABLE_WAD17=1               DISABLE_VM_GML_PROFILER=1               DISABLE_VM_OPCODE_PROFILER=1               DISABLE_VM_STUB_LOGS=1               DISABLE_VM_TRACING=1               BUTTERSCOTCH_COMMIT_HASH="$HASH"               BUTTERSCOTCH_COMMIT_DATE="$DATE"               2>&1 | tee "$LOG"
            return ${PIPESTATUS[0]}
          }

          echo "===== PRIMARY BUILD: SAFE 60% TUNING ====="
          build_once "$LOG1"
          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo
            echo "===== PRIMARY BUILD FAILED ====="
            echo "First compiler errors:"
            grep -nE '(^|[[:space:]])(fatal )?error:' "$LOG1" | head -40 || true

            echo
            echo "===== ERROR CONTEXT ====="
            python3 - "$LOG1" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          lines = p.read_text(errors="replace").splitlines()
          hits = [i for i, line in enumerate(lines) if re.search(r'(^|\s)(fatal )?error:', line)]
          if not hits:
              print("No compiler error line detected; see full log artifact.")
          else:
              i = hits[0]
              for j in range(max(0, i-8), min(len(lines), i+14)):
                  print(f"{j+1}: {lines[j]}")
          PY

            echo
            echo "===== FALLBACK ====="
            echo "Restoring main.c from immediately after the recovered known-good patches."

            cp "$RUNNER_TEMP/superrr-main-known-good.c"                "$GITHUB_WORKSPACE/Butterscotch/src/ios/main.c"

            make distclean >/dev/null 2>&1 || true
            rm -rf build

            build_once "$LOG2"
            STATUS2=$?

            if [ "$STATUS2" -ne 0 ]; then
              echo
              echo "===== FALLBACK BUILD ALSO FAILED ====="
              grep -nE '(^|[[:space:]])(fatal )?error:' "$LOG2" | head -60 || true

              echo
              echo "===== FALLBACK FIRST ERROR CONTEXT ====="
              python3 - "$LOG2" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          lines = p.read_text(errors="replace").splitlines()
          hits = [i for i, line in enumerate(lines) if re.search(r'(^|\s)(fatal )?error:', line)]
          if not hits:
              print("No compiler error line detected; inspect the uploaded log.")
          else:
              i = hits[0]
              for j in range(max(0, i-10), min(len(lines), i+16)):
                  print(f"{j+1}: {lines[j]}")
          PY
              exit "$STATUS2"
            fi

            echo "FALLBACK BUILD SUCCEEDED."
          else
            echo "PRIMARY BUILD SUCCEEDED."
          fi

          exit 0

      - name: Verify IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA="$GITHUB_WORKSPACE/Butterscotch/build/butterscotch.ipa"
          BIN="$GITHUB_WORKSPACE/Butterscotch/build/butterscotch"

          test -f "$IPA"
          test -f "$BIN"

          file "$BIN"
          lipo -info "$BIN" || true
          ls -lh "$IPA"
          unzip -l "$IPA" | grep -i "BundledGame/data.win"

      - name: Prepare Super R-R IPA
        shell: bash
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/output"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          cp \
            "$GITHUB_WORKSPACE/Butterscotch/build/butterscotch.ipa" \
            "$OUT/Super-R-R-iOS-v11.5-60FPS.ipa"

          cat > "$OUT/README.txt" <<'EOF'
          SUPER R-R iOS v11.5
          =================

          Target: iPhone 12 / ARM64 / stable 60 FPS.
          Modern GL, 60% internal framebuffer, O3 + Thin LTO.
          Existing touch controls, pause, FPS display and right LOOK are preserved.
          IPA is unsigned. Sign with Signulous.
          EOF

          ls -lh "$OUT"

      - name: Upload Super R-R IPA
        uses: actions/upload-artifact@v4
        with:
          name: Super-R-R-iOS-v11.5-60FPS-IPA
          path: |
            output/Super-R-R-iOS-v11.5-60FPS.ipa
            output/README.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Super-R-R-v11.5-FAILED
          path: |
            super-rr-v11.5-build-primary.log
            super-rr-v11.5-build-fallback.log
            Butterscotch/src/ios/main.c
            Butterscotch/src/vm_builtins.c
            Butterscotch/src/loop.c
            Butterscotch/src/math_compat.h
            Butterscotch/compat/config.mk
          if-no-files-found: ignore
          retention-days: 7
