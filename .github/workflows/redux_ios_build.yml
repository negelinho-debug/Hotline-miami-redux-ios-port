          )

          old = '''        for (int i = 0; i < 3; i++) {
                      if ([_actionButtons[i] handleTouchEnded:touch]) break;
                  }'''

          new = '''        BOOL actionEnded =
                      NO;

                  for (int i = 0;
                       i < 3;
                       i++) {

                      if ([_actionButtons[i]
                              handleTouchEnded:
                                  touch]) {

                          actionEnded =
                              YES;

                          break;
                      }
                  }

                  if (actionEnded)
                      continue;

                  if (touch ==
                      _aimTouch) {

                      [_aimTouch
                          release];

                      _aimTouch =
                          nil;
                  }'''

          if old not in s:
              raise SystemExit(
                  "ERROR: touch end missing"
              )

          s = s.replace(
              old,
              new,
              1
          )

          old = '''    for (int i = 0; i < 3; i++) [_actionButtons[i] release];
              [super dealloc];'''

          new = '''    for (int i = 0;
                   i < 3;
                   i++)
                  [_actionButtons[i]
                      release];

              if (_aimTouch)
                  [_aimTouch
                      release];

              [super dealloc];'''

          if old not in s:
              raise SystemExit(
                  "ERROR: action dealloc missing"
              )

          s = s.replace(
              old,
              new,
              1
          )

          marker2 = (
              '@implementation BSToggleKeyButton'
          )

          impl = r'''
          @implementation BSActionButton

          - (id)initWithFrame:(CGRect)frame
                  mouseButton:(int32_t)mouseButton
                          key:(int32_t)key
                        label:(NSString *)label
                         font:(CGFloat)fontSize
                 hitExpansion:(CGFloat)expansion {

              if ((self =
                  [super
                      initWithFrame:
                          frame
                      label:
                          label
                      font:
                          fontSize
                      hitExpansion:
                          expansion])) {

                  _mouseButton =
                      mouseButton;

                  _key =
                      key;
              }

              return self;
          }


          - (void)onPress {

              [super onPress];

              if (_key >= 0)
                  bsEnqueueKeyEvent(
                      _key,
                      true
                  );

              if (_mouseButton >
                  GML_MB_NONE)
                  bsEnqueueMouseEvent(
                      _mouseButton,
                      true
                  );
          }


          - (void)onRelease {

              [super onRelease];

              if (_key >= 0)
                  bsEnqueueKeyEvent(
                      _key,
                      false
                  );

              if (_mouseButton >
                  GML_MB_NONE)
                  bsEnqueueMouseEvent(
                      _mouseButton,
                      false
                  );
          }

          @end

          '''

          if marker2 not in s:
              raise SystemExit(
                  "ERROR: action implementation marker missing"
              )

          s = s.replace(
              marker2,
              impl +
              marker2,
              1
          )

          p.write_text(s)

          print(
              "Touch controls complete."
          )
          PY

