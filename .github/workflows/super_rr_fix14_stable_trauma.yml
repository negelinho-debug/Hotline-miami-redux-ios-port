
name: Super RR Fix 14 - Stable Trauma TEST

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Super RR Fix14 (no experimental enemy loop)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover v11.7 and repair duplicated function
        shell: bash
        run: |
          set -euo pipefail

          git show \
            5f5033393f3a7b2b7838e8688f1294efa99c1395:.github/workflows/redux_ios_build.yml \
            > "$RUNNER_TEMP/working-v11.7.yml"
          test -s "$RUNNER_TEMP/working-v11.7.yml"

          python3 -m venv "$RUNNER_TEMP/rr-venv"
          "$RUNNER_TEMP/rr-venv/bin/python" -m pip install --quiet PyYAML

          cat > "$RUNNER_TEMP/rebuild.py" <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path
          import yaml

          root = Path(os.environ["GITHUB_WORKSPACE"])
          source = Path(os.environ["RUNNER_TEMP"]) / "working-v11.7.yml"
          config = yaml.safe_load(source.read_text(encoding="utf-8"))
          steps = config["jobs"]["ios"]["steps"]
          env = dict(os.environ)
          envfile = Path(env["GITHUB_ENV"])

          def reload_env():
              if not envfile.is_file():
                  return
              for line in envfile.read_text(encoding="utf-8").splitlines():
                  if re.match(r"^[A-Za-z_][A-Za-z0-9_]*=", line):
                      key, value = line.split("=", 1)
                      env[key] = value


          def patch_trauma_game_data():
              # Patch only the original, verified Super R-R release.
              import hashlib
              import shutil
              import struct

              src = Path(env.get("DATAWIN", ""))
              if not src.is_file():
                  raise RuntimeError("DATAWIN was not downloaded; refusing to build")

              raw = bytearray(src.read_bytes())
              expected = "bac1a7d5ab2edaa966ca275f97a83e5baeae5d1c22112be96c29d0fdb8eedc37"
              original_hash = hashlib.sha256(raw).hexdigest()
              if original_hash != expected:
                  raise RuntimeError("Unknown original game version: " + original_hash)

              def u32(offset):
                  return struct.unpack_from("<I", raw, offset)[0]

              if raw[:4] != b"FORM":
                  raise RuntimeError("GameMaker FORM header missing")
              chunks = {}
              off = 8
              while off + 8 <= len(raw):
                  tag = bytes(raw[off:off + 4]).decode("ascii")
                  size = u32(off + 4)
                  chunks[tag] = off + 8
                  off += 8 + size
              if off != len(raw):
                  raise RuntimeError("Invalid GameMaker data.win chunks")

              objt = chunks["OBJT"]
              room = chunks["ROOM"]
              door_index = 753
              if u32(objt) <= door_index or u32(room) <= 126:
                  raise RuntimeError("Super R-R object or room count changed")

              door_ptr = u32(objt + 4 + door_index * 4)
              name_ptr = u32(door_ptr)
              name = bytes(raw[name_ptr:name_ptr + 25]).split(b"\x00", 1)[0]
              if name != b"objHospitalEntranceDoors":
                  raise RuntimeError("Unexpected Trauma door object: " + repr(name))
              if u32(door_ptr + 12) != 1:
                  raise RuntimeError("Unexpected Trauma door solid flag")

              room_ptr = u32(room + 4 + 126 * 4)
              instances_ptr = u32(room_ptr + 48)
              ids = set()
              for i in range(u32(instances_ptr)):
                  inst = u32(instances_ptr + 4 + 4 * i)
                  if u32(inst + 8) == door_index:
                      ids.add(u32(inst + 12))
              if ids != {114073, 114203}:
                  raise RuntimeError("Unexpected hospital door instances: " + str(ids))

              struct.pack_into("<I", raw, door_ptr + 12, 0)
              patched_hash = "1b4ac9d5e96b8b14217b9d4eb749734023ca8ca668113d217203125096ab4913"
              if hashlib.sha256(raw).hexdigest() != patched_hash:
                  raise RuntimeError("Trauma patch checksum mismatch")

              src.write_bytes(raw)
              bundled = root / "Butterscotch/artifacts/ios/assets/BundledGame/data.win"
              if not bundled.is_file():
                  raise RuntimeError("BundledGame/data.win missing before compilation")
              shutil.copyfile(src, bundled)
              if hashlib.sha256(bundled.read_bytes()).hexdigest() != patched_hash:
                  raise RuntimeError("Bundled data.win mismatch")
              print("TRAUMA GAMEPLAY PATCH APPLIED: hospital doors solid 1 -> 0", flush=True)
              print("Data SHA256: " + patched_hash, flush=True)

          def remove_duplicate_ortho():
              p = root / "Butterscotch/src/vm_builtins.c"
              s = p.read_text(encoding="utf-8")
              pattern = r"\bstatic\s+RValue\s+builtin_d3d_set_projection_ortho\s*\("
              hits = list(re.finditer(pattern, s))
              print(f"Projection function definitions: {len(hits)}", flush=True)

              if len(hits) == 1:
                  return
              if len(hits) != 2:
                  raise RuntimeError("Unexpected projection function count: " + str(len(hits)))

              # Keep the native upstream function; remove only the later
              # duplicate added by the old Super R-R rendering patch.
              start = hits[1].start()
              opening = s.find("{", hits[1].end())
              if opening < 0 or opening - start > 300:
                  raise RuntimeError("Cannot locate duplicate function body")

              depth = 0
              end = None
              for i in range(opening, len(s)):
                  if s[i] == "{":
                      depth += 1
                  elif s[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise RuntimeError("Unclosed duplicate function")

              patched = s[:start] + "\n/* Old duplicate removed by Fix 12. */\n" + s[end:]
              if len(list(re.finditer(pattern, patched))) != 1:
                  raise RuntimeError("Duplicate cleanup validation failed")
              p.write_text(patched, encoding="utf-8")
              print("Removed legacy duplicate; retained upstream implementation.", flush=True)

          for index, step in enumerate(steps):
              name = step.get("name", f"Step {index}")
              if "run" not in step:
                  continue

              if name == "Build Super R-R iOS IPA with automatic fallback":
                  remove_duplicate_ortho()

              print(f"===== {name} =====", flush=True)
              script = root / f"v11_7_step_{index}.sh"
              script.write_text(step["run"], encoding="utf-8")
              subprocess.run(
                  ["bash", "-eo", "pipefail", str(script)],
                  cwd=root,
                  env=env,
                  check=True,
              )
              reload_env()
              if name == "Apply all known-good Super R-R base patches":
                  patch_trauma_game_data()
          PY

          "$RUNNER_TEMP/rr-venv/bin/python" "$RUNNER_TEMP/rebuild.py"

      - name: Verify ARM64 IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA="Butterscotch/build/butterscotch.ipa"
          BIN="Butterscotch/build/butterscotch"
          test -s "$IPA"
          test -s "$BIN"
          lipo -archs "$BIN" | grep -qw arm64
          unzip -t "$IPA" >/dev/null
          unzip -l "$IPA" | grep 'BundledGame/data.win'

          python3 - <<'PYVERIFY'
          import hashlib
          import zipfile
          expected = "1b4ac9d5e96b8b14217b9d4eb749734023ca8ca668113d217203125096ab4913"
          ipa = "Butterscotch/build/butterscotch.ipa"
          with zipfile.ZipFile(ipa) as z:
              names = [n for n in z.namelist() if n.endswith("BundledGame/data.win")]
              if len(names) != 1:
                  raise RuntimeError("Expected exactly one bundled data.win")
              digest = hashlib.sha256(z.read(names[0])).hexdigest()
              if digest != expected:
                  raise RuntimeError("Trauma patch absent from IPA: " + digest)
          print("VERIFIED: Trauma patch is inside final IPA")
          PYVERIFY

      - name: Prepare IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp Butterscotch/build/butterscotch.ipa \
            output/Super-RR-iOS-Fix14-Trauma-TEST.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Super-RR-iOS-Fix14-Trauma-TEST
          path: output/Super-RR-iOS-Fix14-Trauma-TEST.ipa
          if-no-files-found: error
          retention-days: 7
