name: Redux-Redux Menu Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  menu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Redux-Redux
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/input"

          TAG="$(gh release view \
            --json tagName \
            --jq '.tagName')"

          gh release download "$TAG" \
            --pattern "*.zip" \
            --dir "$GITHUB_WORKSPACE/input"

          ZIP="$(find "$GITHUB_WORKSPACE/input" \
            -type f \
            -iname "*.zip" \
            | head -n 1)"

          mkdir -p "$GITHUB_WORKSPACE/game"

          unzip -q "$ZIP" \
            -d "$GITHUB_WORKSPACE/game"

          DATAWIN="$(find "$GITHUB_WORKSPACE/game" \
            -type f \
            -iname "data.win" \
            | head -n 1)"

          if [ -z "$DATAWIN" ]; then
            echo "ERROR: data.win not found"
            exit 1
          fi

          GAME_DIR="$(dirname "$DATAWIN")"

          echo "DATAWIN=$DATAWIN" >> "$GITHUB_ENV"
          echo "GAME_DIR=$GAME_DIR" >> "$GITHUB_ENV"

      - name: Download Butterscotch
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            https://github.com/ButterscotchRunner/Butterscotch.git \
            "$GITHUB_WORKSPACE/Butterscotch"

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update -o Acquire::Retries=3

          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            libglfw3-dev \
            xvfb \
            xdotool \
            imagemagick \
            libgl1-mesa-dri \
            libgl1-mesa-dev

      - name: Configure Butterscotch
        shell: bash
        run: |
          set -e

          cmake \
            -S "$GITHUB_WORKSPACE/Butterscotch" \
            -B "$GITHUB_WORKSPACE/Butterscotch/build" \
            -G Ninja \
            -DPLATFORM=cli \
            -DBACKEND=glfw3 \
            -DAUDIO_BACKEND=none \
            -DENABLE_WAD14=OFF \
            -DENABLE_WAD16=ON \
            -DENABLE_WAD17=OFF \
            -DENABLE_VM_STUB_LOGS=ON \
            -DENABLE_ASAN=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Butterscotch
        shell: bash
        run: |
          set -e

          cmake \
            --build "$GITHUB_WORKSPACE/Butterscotch/build" \
            --parallel 4

          RUNNER="$(find "$GITHUB_WORKSPACE/Butterscotch/build" \
            -type f \
            -name "butterscotch" \
            -perm -111 \
            | head -n 1)"

          if [ -z "$RUNNER" ]; then
            echo "ERROR: runner not found"
            exit 1
          fi

          echo "RUNNER=$RUNNER" >> "$GITHUB_ENV"

      - name: Prepare test
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/results"
          mkdir -p "$GITHUB_WORKSPACE/save"

          touch "$GAME_DIR/steamoff"

      - name: Boot and enter menu
        shell: bash
        run: |
          set +e

          export RUNNER
          export DATAWIN
          export GAME_DIR
          export GITHUB_WORKSPACE

          xvfb-run \
            -a \
            -s "-screen 0 1366x768x24" \
            bash -c '
              cd "$GAME_DIR"

              "$RUNNER" \
                "$DATAWIN" \
                --save-folder "$GITHUB_WORKSPACE/save" \
                > "$GITHUB_WORKSPACE/results/MENU_LOG.txt" \
                2>&1 &

              GAME_PID=$!

              echo "Runner PID: $GAME_PID"

              sleep 5

              echo "===== WINDOWS =====" \
                > "$GITHUB_WORKSPACE/results/WINDOWS.txt"

              xdotool search \
                --onlyvisible \
                --name ".*" \
                getwindowname %@ \
                >> "$GITHUB_WORKSPACE/results/WINDOWS.txt" \
                2>&1 \
                || true

              # Try to leave the splash screen
              xdotool key Return || true

              sleep 2

              xdotool key space || true

              sleep 2

              xdotool key Return || true

              sleep 5

              import \
                -window root \
                "$GITHUB_WORKSPACE/results/redux_menu.png" \
                || true

              sleep 2

              kill "$GAME_PID" 2>/dev/null || true
              wait "$GAME_PID" 2>/dev/null || true
            '

          echo "Menu test finished."

          exit 0

      - name: Create report
        shell: bash
        run: |
          {
            echo "SUPER REDUX-REDUX MENU TEST"
            echo "==========================="
            echo

            if [ -f "$GITHUB_WORKSPACE/results/redux_menu.png" ]; then
              echo "Screenshot: YES"
            else
              echo "Screenshot: NO"
            fi

            echo
            echo "Windows:"
            cat "$GITHUB_WORKSPACE/results/WINDOWS.txt" || true

            echo
            echo "Last log lines:"
            tail -n 100 \
              "$GITHUB_WORKSPACE/results/MENU_LOG.txt" \
              || true
          } > "$GITHUB_WORKSPACE/results/REPORT.txt"

          cat "$GITHUB_WORKSPACE/results/REPORT.txt"

      - name: Upload menu test
        uses: actions/upload-artifact@v4
        with:
          name: redux-menu-test
          path: results/
          if-no-files-found: error
          retention-days: 7
