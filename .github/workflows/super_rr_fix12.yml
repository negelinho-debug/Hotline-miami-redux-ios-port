
name: Super RR Fix 12 - iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Super RR for iPhone
    runs-on: macos-15
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the last successfully built workflow
        shell: bash
        run: |
          set -euo pipefail

          git show \
            5f5033393f3a7b2b7838e8688f1294efa99c1395:.github/workflows/redux_ios_build.yml \
            > "$RUNNER_TEMP/working-v11.7.yml"

          test -s "$RUNNER_TEMP/working-v11.7.yml"

          python3 -m venv "$RUNNER_TEMP/rr-venv"
          "$RUNNER_TEMP/rr-venv/bin/python" -m pip install --quiet PyYAML

          cat > "$RUNNER_TEMP/rebuild.py" <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          import yaml

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          source = Path(os.environ["RUNNER_TEMP"]) / "working-v11.7.yml"
          workflow = yaml.safe_load(source.read_text(encoding="utf-8"))
          steps = workflow["jobs"]["ios"]["steps"]

          env = dict(os.environ)
          env_file = Path(env["GITHUB_ENV"])

          def reload_environment():
              if not env_file.exists():
                  return
              for line in env_file.read_text(encoding="utf-8").splitlines():
                  if re.match(r"^[A-Za-z_][A-Za-z0-9_]*=", line):
                      key, value = line.split("=", 1)
                      env[key] = value

          for index, step in enumerate(steps):
              if "run" not in step:
                  continue

              name = step.get("name", f"Step {index}")
              print(f"===== {name} =====", flush=True)
              script = workspace / f"v11_7_step_{index}.sh"
              script.write_text(step["run"], encoding="utf-8")

              # GH_TOKEN is provided by this workflow.
              subprocess.run(
                  ["bash", "-eo", "pipefail", str(script)],
                  cwd=workspace,
                  env=env,
                  check=True,
              )
              reload_environment()

          print("Completed all original v11.7 build steps.", flush=True)
          PY

          "$RUNNER_TEMP/rr-venv/bin/python" "$RUNNER_TEMP/rebuild.py"

      - name: Verify iOS ARM64 IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA="Butterscotch/build/butterscotch.ipa"
          BIN="Butterscotch/build/butterscotch"

          test -s "$IPA"
          test -s "$BIN"
          file "$BIN"
          lipo -archs "$BIN" | grep -qw arm64
          unzip -t "$IPA" > /dev/null
          unzip -l "$IPA" | grep 'BundledGame/data.win'
          echo "IPA archive and ARM64 binary verified."

      - name: Prepare output IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp Butterscotch/build/butterscotch.ipa \
            output/Super-RR-iOS-v11.7-Baseline.ipa
          ls -lh output/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Super-RR-iOS-Baseline
          path: output/Super-RR-iOS-v11.7-Baseline.ipa
          if-no-files-found: error
          retention-days: 7
